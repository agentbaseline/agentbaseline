<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 358" width="880" height="358" role="img" aria-labelledby="ft fd">
  <title id="ft">The visibility gap</title>
  <desc id="fd">A person asks an agent to do something. The agent uses a model, instructions and tools, and acts on a system of record. The identity provider records only that a service account called an API: no agent, no task, no delegation, and no way to tie the action back to the person who asked for it.</desc>
  <rect width="880" height="358" fill="#FFFFFF"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#797D79"/></marker><linearGradient id="fadeCBCDC80x880" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#CBCDC8" stop-opacity="0"/><stop offset="0.06" stop-color="#CBCDC8" stop-opacity="1"/><stop offset="0.82" stop-color="#CBCDC8" stop-opacity="1"/><stop offset="1" stop-color="#CBCDC8" stop-opacity="0"/></linearGradient></defs>
  <text x="0" y="30" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#5A5E5A" font-weight="400" letter-spacing="0.12em">WHAT HAPPENED</text>
  <text x="0" y="72" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="17" fill="#1A1C1A" font-weight="700">A person</text>
  <text x="0" y="94" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">asks for something</text>
  <line x1="150" y1="68" x2="196" y2="68" stroke="#797D79" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="216" y="72" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="17" fill="#1A1C1A" font-weight="700">An agent</text>
  <text x="216" y="94" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">model, instructions, tools</text>
  <line x1="470" y1="68" x2="516" y2="68" stroke="#797D79" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="536" y="72" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="17" fill="#1A1C1A" font-weight="700">A system of record</text>
  <text x="536" y="94" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">money, data, production</text>
  <line x1="0" y1="196" x2="880" y2="196" stroke="url(#fadeCBCDC80x880)" stroke-width="1"/>
  <text x="0" y="218" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#5A5E5A" font-weight="400" letter-spacing="0.12em">WHAT YOUR IDENTITY PROVIDER RECORDED</text>
  <text x="0" y="256" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16" fill="#1A1C1A" font-weight="700" letter-spacing="0.02em">svc-automation-07 called POST /transfers</text>
  <path d="M0 282 L168 282" stroke="#A3401E" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="0" y="306" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="15" fill="#A3401E" font-weight="400">which agent</text>
  <path d="M220 282 L388 282" stroke="#A3401E" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="220" y="306" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="15" fill="#A3401E" font-weight="400">which task</text>
  <path d="M440 282 L608 282" stroke="#A3401E" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="440" y="306" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="15" fill="#A3401E" font-weight="400">who asked</text>
  <path d="M660 282 L828 282" stroke="#A3401E" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="660" y="306" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="15" fill="#A3401E" font-weight="400">under what authority</text>
  <text x="0" y="340" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="16" fill="#1A1C1A" font-weight="700">The person can deny they authorised it, and nothing in the record contradicts them.</text>
  </svg>
