<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" role="img" aria-labelledby="ft fd">
  <title id="ft">The six outcomes as one control system</title>
  <desc id="fd">Discover establishes the operating envelope above the action path. Business intent passes through Authorize, Constrain and Validate — grouped, because every material action must go through them — and becomes an enterprise action. Observe and Respond hold evidence and containment beneath.</desc>
  <rect width="880" height="390" fill="#FFFFFF"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#797D79"/></marker></defs>
  <text x="0" y="32" font-family="'Chakra Petch','Avenir Next',sans-serif" font-size="12" fill="#5A5E5A" font-weight="500" letter-spacing="0.1em">ESTABLISH THE OPERATING ENVELOPE</text>
  <rect x="0" y="44" width="176" height="74" rx="4" fill="none" stroke="#E4E5E1" stroke-width="1"/>
  <a href="/controls#discover"><text x="16" y="74" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="20" fill="#1A1C1A" font-weight="600">Discover</text></a>
  <text x="16" y="98" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">find what exists</text>
  <text x="0" y="203.0" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="16" fill="#1A1C1A" font-weight="600">Business intent</text>
  <text x="0" y="225.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">a person, service</text>
  <text x="0" y="246.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">or business event</text>
  <line x1="150" y1="209.0" x2="172" y2="209.0" stroke="#797D79" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="184" y="158" font-family="'Chakra Petch','Avenir Next',sans-serif" font-size="12" fill="#5A5E5A" font-weight="500" letter-spacing="0.1em">CONTROL EACH MATERIAL ACTION</text>
  <rect x="184" y="172" width="152" height="74" rx="4" fill="none" stroke="#E4E5E1" stroke-width="1"/>
  <a href="/controls#authorize"><text x="200" y="202" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="20" fill="#1A1C1A" font-weight="600">Authorize</text></a>
  <text x="200" y="226" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">bind authority</text>
  <rect x="346" y="172" width="152" height="74" rx="4" fill="none" stroke="#E4E5E1" stroke-width="1"/>
  <a href="/controls#constrain"><text x="362" y="202" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="20" fill="#1A1C1A" font-weight="600">Constrain</text></a>
  <text x="362" y="226" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">limit reach</text>
  <rect x="508" y="172" width="152" height="74" rx="4" fill="none" stroke="#E4E5E1" stroke-width="1"/>
  <a href="/controls#validate"><text x="524" y="202" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="20" fill="#1A1C1A" font-weight="600">Validate</text></a>
  <text x="524" y="226" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">verify outcomes</text>
  <line x1="672" y1="209.0" x2="700" y2="209.0" stroke="#797D79" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="712" y="203.0" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="16" fill="#1A1C1A" font-weight="600">Enterprise action</text>
  <text x="712" y="225.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">a tool, API,</text>
  <text x="712" y="246.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">record or message</text>
  <text x="0" y="296" font-family="'Chakra Petch','Avenir Next',sans-serif" font-size="12" fill="#5A5E5A" font-weight="500" letter-spacing="0.1em">MAINTAIN EVIDENCE AND CONTAINMENT</text>
  <rect x="0" y="308" width="196" height="74" rx="4" fill="none" stroke="#E4E5E1" stroke-width="1"/>
  <a href="/controls#observe"><text x="16" y="338" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="20" fill="#1A1C1A" font-weight="600">Observe</text></a>
  <text x="16" y="362" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">prove what happened</text>
  <rect x="220" y="308" width="176" height="74" rx="4" fill="none" stroke="#E4E5E1" stroke-width="1"/>
  <a href="/controls#respond"><text x="236" y="338" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="20" fill="#1A1C1A" font-weight="600">Respond</text></a>
  <text x="236" y="362" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">stop and contain</text>
  </svg>
