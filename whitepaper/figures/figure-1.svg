<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 422" width="880" height="422" role="img" aria-labelledby="ft fd">
  <title id="ft">The six outcomes as one control system</title>
  <desc id="fd">Discover establishes the operating envelope above the action path. Business intent passes through Authorize, Constrain and Validate — the only enclosed stage, because every material action must go through it — and becomes an enterprise action. Observe and Respond hold evidence and containment beneath.</desc>
  <rect width="880" height="422" fill="#FFFFFF"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#797D79"/></marker></defs>
  <text x="0" y="32" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#5A5E5A" font-weight="400" letter-spacing="0.12em">ESTABLISH THE OPERATING ENVELOPE</text>
  <a href="/controls#discover"><text x="0" y="66" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="21" fill="#1A1C1A" font-weight="700">Discover</text></a>
  <text x="0" y="92" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="16" fill="#5A5E5A" font-weight="400">find what exists</text>
  <text x="0" y="209.0" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="16" fill="#1A1C1A" font-weight="700">Business intent</text>
  <text x="0" y="231.0" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="16" fill="#5A5E5A" font-weight="400">a person, service</text>
  <text x="0" y="252.0" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="16" fill="#5A5E5A" font-weight="400">or business event</text>
  <line x1="150" y1="215.0" x2="182" y2="215.0" stroke="#797D79" stroke-width="1.1" marker-end="url(#ar)"/>
  <rect x="196" y="136" width="460" height="158" rx="3" fill="none" stroke="#E4E5E1" stroke-width="1"/>
  <text x="220" y="166" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#5A5E5A" font-weight="400" letter-spacing="0.12em">CONTROL EACH MATERIAL ACTION</text>
  <a href="/controls#authorize"><text x="220" y="214" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="21" fill="#1A1C1A" font-weight="700">Authorize</text></a>
  <text x="220" y="240" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="16" fill="#5A5E5A" font-weight="400">bind authority</text>
  <a href="/controls#constrain"><text x="357" y="214" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="21" fill="#1A1C1A" font-weight="700">Constrain</text></a>
  <text x="357" y="240" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="16" fill="#5A5E5A" font-weight="400">limit reach</text>
  <a href="/controls#validate"><text x="494" y="214" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="21" fill="#1A1C1A" font-weight="700">Validate</text></a>
  <text x="494" y="240" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="16" fill="#5A5E5A" font-weight="400">verify outcomes</text>
  <line x1="670" y1="215.0" x2="700" y2="215.0" stroke="#797D79" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="712" y="209.0" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="16" fill="#1A1C1A" font-weight="700">Enterprise action</text>
  <text x="712" y="231.0" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="16" fill="#5A5E5A" font-weight="400">a tool, API,</text>
  <text x="712" y="252.0" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="16" fill="#5A5E5A" font-weight="400">record or message</text>
  <text x="0" y="344" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#5A5E5A" font-weight="400" letter-spacing="0.12em">MAINTAIN EVIDENCE AND CONTAINMENT</text>
  <a href="/controls#observe"><text x="0" y="378" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="21" fill="#1A1C1A" font-weight="700">Observe</text></a>
  <text x="0" y="404" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="16" fill="#5A5E5A" font-weight="400">prove what happened</text>
  <a href="/controls#respond"><text x="220" y="378" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="21" fill="#1A1C1A" font-weight="700">Respond</text></a>
  <text x="220" y="404" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="16" fill="#5A5E5A" font-weight="400">stop and contain</text>
  </svg>
