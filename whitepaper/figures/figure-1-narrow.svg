<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 0 364 596" width="360" height="596" role="img" aria-labelledby="ft fd">
  <title id="ft">The six outcomes as one control system</title>
  <desc id="fd">Discover comes first. Business intent passes through Constrain, Authorize and Validate to become an enterprise action. Observe and Respond hold evidence and containment across every run.</desc>
  <rect width="360" height="640" fill="#FFFFFF"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#797D79"/></marker></defs>
  <a href="/controls#discover"><text x="0" y="26" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="20" fill="#1A1C1A" font-weight="600">Discover</text></a>
  <rect x="0" y="190" width="360" height="214" rx="4" fill="none" stroke="#E4E5E1" stroke-width="1"/>
  <text x="0" y="50" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">find what exists</text>
  <path d="M8 66 L8 92" stroke="#797D79" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="0" y="104" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="16" fill="#1A1C1A" font-weight="600">Business intent</text>
  <text x="0" y="126" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">a person, service or business event</text>
  <path d="M8 144 L8 172" stroke="#797D79" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="18" y="208" font-family="'Chakra Petch','Avenir Next',sans-serif" font-size="11" fill="#5A5E5A" font-weight="500" letter-spacing="0.1em">CONTROL EACH MATERIAL ACTION</text>
  <a href="/controls#constrain"><text x="18" y="248" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="18" fill="#1A1C1A" font-weight="600">Constrain</text></a>
  <text x="18" y="270" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">limit reach</text>
  <a href="/controls#authorize"><text x="18" y="302" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="18" fill="#1A1C1A" font-weight="600">Authorize</text></a>
  <text x="18" y="324" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">bind authority</text>
  <a href="/controls#validate"><text x="18" y="356" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="18" fill="#1A1C1A" font-weight="600">Validate</text></a>
  <text x="18" y="378" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">verify outcomes</text>
  <path d="M8 406 L8 432" stroke="#797D79" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="0" y="464" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="16" fill="#1A1C1A" font-weight="600">Enterprise action</text>
  <text x="0" y="486" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">a tool, API, record or message</text>
  <text x="0" y="524" font-family="'Chakra Petch','Avenir Next',sans-serif" font-size="11" fill="#5A5E5A" font-weight="500" letter-spacing="0.1em">MAINTAIN EVIDENCE AND CONTAINMENT</text>
  <a href="/controls#observe"><text x="0" y="564" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="18" fill="#1A1C1A" font-weight="600">Observe</text></a>
  <text x="0" y="586" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">prove what happened</text>
  <a href="/controls#respond"><text x="180" y="564" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="18" fill="#1A1C1A" font-weight="600">Respond</text></a>
  <text x="180" y="586" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">stop and contain</text>
  </svg>
