# Contributors — the authority argument for this document.
#
# People, not logos. Named individuals with their affiliation and the sections
# they wrote. Sourced from the drafting record: the Technical DRI line, the
# per-section author headings, and the band-ownership table.
#
# ⟡ Entries marked `confirmed: false` are inferred from the drafting record and
#   MUST be verified with the person before publication. Do not publish an
#   affiliation or an email that person has not agreed to.
#
# `sortkey` is the surname, and the page renders in that order. The axis matters
# with a list this small: sorting on first name — Chris, David, Jelmer, Kamil,
# Ranti, William — groups the six into three company pairs, the one arrangement
# that makes a joint document read as three separate delegations. Surname order
# interleaves them (Docker, Snyk, Docker, Keycard, Snyk, Keycard), so nobody is
# first because of their employer, and the order holds as the list grows.
---
