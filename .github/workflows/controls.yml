name: controls

on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce the controls's own rules
        run: python3 bin/check-controls
      - name: Figure geometry — no overlaps, no escaping text, ranges match
        run: |
          (cd whitepaper/figures && python3 build-figure-1.py)
          python3 bin/check-figure
      - name: Rebuild CONTROLS.md and fail on drift
        run: |
          python3 bin/render-controls
          git diff --exit-code whitepaper/CONTROLS.md \
            || { echo "::error::CONTROLS.md is stale — run bin/render-controls"; exit 1; }
      - name: Rebuild Figure 1 and fail on drift
        run: |
          python3 whitepaper/figures/build-figure-1.py
          git diff --exit-code whitepaper/figures/*.svg \
            || { echo "::error::figure-1.svg is stale — regenerate it from controls.yaml"; exit 1; }
