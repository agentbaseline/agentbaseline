<svg xmlns="http://www.w3.org/2000/svg" class="sfl-d" viewBox="0 0 1000 632" role="group" aria-label="An orchestrator agent chooses the next step: it takes in requests, context and signals, proposes each task’s profile and scope to the authorization service, which alone grants access, and schedules the tasks on the execution layer, which starts each agent in its own sandbox behind its own proxy. Monitoring agents watch from outside. Changes go through approval and deploy to production, and incidents, findings and evals come back as signals that start new work, which is the outer loop. Pills name the boundaries as the paper numbers them: 1 sandbox, 2 network, 3 supply chain, 4 identity and access.">
<defs><marker id="sfl3w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="sfl-mk" d="M0 0 L10 5 L0 10 z"/></marker><marker id="sfl3w-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.3" markerHeight="5.3" orient="auto-start-reverse"><path class="sfl-mk sfl-mk-main" d="M0 0 L10 5 L0 10 z"/></marker><marker id="sfl3w-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="sfl-mk sfl-mk-g" d="M0 0 L10 5 L0 10 z"/></marker><marker id="sfl3w-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="sfl-mk sfl-mk-o" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<g data-frame="zone" data-zone="The factory"><rect class="sfl-zone" x="164.5" y="168.5" width="571" height="291" rx="8"/><g class="sfl-node" data-part="zone" tabindex="0" role="img" aria-label="The factory" aria-describedby="sfl3w-zone-1"><desc id="sfl3w-zone-1">Proactive and always on. Each task’s agent runs only for its task, in its own sandbox behind its own proxy, with its own identity and scope.</desc><rect class="sfl-hit" x="168" y="172" width="117.7" height="26"/><text class="sfl-cap" x="176" y="186.6" font-size="12">THE FACTORY</text></g></g>
<g data-frame="sandbox"><rect class="sfl-sb sfl-ghost" x="192.5" y="216.5" width="359" height="111" rx="6"/><rect class="sfl-sb sfl-ghost" x="186.5" y="210.5" width="359" height="111" rx="6"/><rect class="sfl-sb" x="180.5" y="204.5" width="359" height="111" rx="8"/><g class="sfl-node" data-part="sandbox" tabindex="0" role="img" aria-label="Sandbox" aria-describedby="sfl3w-sandbox-2"><desc id="sfl3w-sandbox-2">Each agent in a run gets its own sandbox, configured from the profile for its kind of agent. Monitoring that watches from outside can tighten or stop it mid-run.</desc><g class="sfl-pill" data-b="sandbox" aria-hidden="true"><rect x="190" y="192.3" width="82.8" height="19.5" rx="9.75"/><text x="198" y="206.1" font-size="11.5">1 SANDBOX</text></g></g></g>
<g data-frame="behind" data-zone="Behind the proxy"><rect class="sfl-zone" x="752.5" y="168.5" width="231" height="203" rx="8"/><g class="sfl-node" data-part="behind" tabindex="0" role="img" aria-label="Behind the proxy" aria-describedby="sfl3w-behind-3"><desc id="sfl3w-behind-3">What the agent reaches, and only through the proxy, with only the operations the service authorized.</desc><rect class="sfl-hit" x="756" y="172" width="162.1" height="26"/><text class="sfl-cap" x="764" y="186.6" font-size="12">BEHIND THE PROXY</text></g></g>
<g data-frame="output" data-zone="Output"><rect class="sfl-zone" x="164.5" y="500.5" width="819" height="83" rx="8"/><g class="sfl-node" data-part="output" tabindex="0" role="img" aria-label="Output" aria-describedby="sfl3w-output-4"><desc id="sfl3w-output-4">What leaves the factory, and the review and approval it passes on the way.</desc><rect class="sfl-hit" x="168" y="504" width="73.3" height="26"/><text class="sfl-cap" x="176" y="518.6" font-size="12">OUTPUT</text></g></g>
<path class="sfl-wire" d="M148 36 L180 36" marker-end="url(#sfl3w-a)"/>
<path class="sfl-wire" d="M556 36 L500 36" marker-end="url(#sfl3w-a)"/>
<path class="sfl-wire sfl-main" d="M526 252 L588 252" marker-end="url(#sfl3w-m)"/>
<path class="sfl-wire" d="M724 252 L744 252"/>
<path class="sfl-wire" d="M744 224 V336"/>
<path class="sfl-wire" d="M744 224 L764 224" marker-end="url(#sfl3w-a)"/>
<path class="sfl-wire" d="M744 280 L764 280" marker-end="url(#sfl3w-a)"/>
<path class="sfl-wire" d="M744 336 L764 336" marker-end="url(#sfl3w-a)"/>
<path class="sfl-wire" d="M764 552 L748 552" marker-end="url(#sfl3w-a)"/>
<path class="sfl-wire" d="M588 552 L564 552" marker-end="url(#sfl3w-a)"/>
<path class="sfl-wire" d="M404 552 L372 552" marker-end="url(#sfl3w-a)"/>
<path class="sfl-wire" d="M180 552 L148 552" marker-end="url(#sfl3w-a)"/>
<path class="sfl-wire sfl-loop" d="M82 532 L82 68 L200 68 L200 56" marker-end="url(#sfl3w-o)"/>
<g class="sfl-node sfl-edge" data-part="schedules" tabindex="0" role="img" aria-label="schedules tasks" aria-describedby="sfl3w-schedules-9"><desc id="sfl3w-schedules-9">The orchestrator schedules each task on the execution layer, a separate system. It never starts agents itself.</desc><path class="sfl-hit" d="M340 56 L340 88"/><path class="sfl-wire" d="M340 56 L340 88" marker-end="url(#sfl3w-a)"/><rect class="sfl-plate" x="278.7" y="62.8" width="122.7" height="18.5"/><text class="sfl-l" x="340" y="76.5" font-size="12.5" text-anchor="middle">schedules tasks</text></g>
<g class="sfl-node sfl-edge" data-part="starts" tabindex="0" role="img" aria-label="starts the agent" aria-describedby="sfl3w-starts-10"><desc id="sfl3w-starts-10">The execution layer starts the agent in a fresh sandbox with its profile and only its authorized scope, and won’t start it if a required enforcement point is down.</desc><path class="sfl-hit" d="M340 128 L340 204"/><path class="sfl-wire" d="M340 128 L340 204" marker-end="url(#sfl3w-a)"/><rect class="sfl-plate" x="274.9" y="142.8" width="130.2" height="18.5"/><text class="sfl-l" x="340" y="156.5" font-size="12.5" text-anchor="middle">starts the agent</text></g>
<g class="sfl-node sfl-edge" data-part="proposes" tabindex="0" role="img" aria-label="proposes profile and scope" aria-describedby="sfl3w-proposes-15"><desc id="sfl3w-proposes-15">In preflight the orchestrator proposes a profile and task scope for each piece of work. It proposes; the service alone decides.</desc><path class="sfl-hit" d="M480 56 L480 68 L790 68 L790 88"/><path class="sfl-wire" d="M480 56 L480 68 L790 68 L790 88" marker-end="url(#sfl3w-a)"/><rect class="sfl-plate" x="532.3" y="58.8" width="205.3" height="18.5"/><text class="sfl-l" x="635" y="72.5" font-size="12.5" text-anchor="middle">proposes profile and scope</text></g>
<g class="sfl-node sfl-edge" data-part="authorized" tabindex="0" role="img" aria-label="authorized scope" aria-describedby="sfl3w-authorized-16"><desc id="sfl3w-authorized-16">The service’s decision, which the proxy enforces: it blocks what the service hasn’t authorized. Only a new decision can widen a task.</desc><path class="sfl-hit" d="M690 128 L690 232"/><path class="sfl-wire sfl-grant" d="M690 128 L690 232" marker-end="url(#sfl3w-g)"/><rect class="sfl-plate" x="624.9" y="142.8" width="130.2" height="18.5"/><text class="sfl-l" x="690" y="156.5" font-size="12.5" text-anchor="middle">authorized scope</text></g>
<g class="sfl-node sfl-edge" data-part="watches" tabindex="0" role="img" aria-label="watches" aria-describedby="sfl3w-watches-21"><desc id="sfl3w-watches-21">From outside the sandbox, for thrash and drift.</desc><path class="sfl-hit" d="M300 348 L300 316"/><path class="sfl-wire" d="M300 348 L300 316" marker-end="url(#sfl3w-a)"/><rect class="sfl-plate" x="268.7" y="322.8" width="62.6" height="18.5"/><text class="sfl-l" x="300" y="336.5" font-size="12.5" text-anchor="middle">watches</text></g>
<g class="sfl-node sfl-edge" data-part="opens" tabindex="0" role="img" aria-label="opens" aria-describedby="sfl3w-opens-23"><desc id="sfl3w-opens-23">The agent opens its pull request in source control, through the proxy.</desc><path class="sfl-hit" d="M868 356 L868 532"/><path class="sfl-wire" d="M868 356 L868 532" marker-end="url(#sfl3w-a)"/><rect class="sfl-plate" x="844.2" y="434.8" width="47.6" height="18.5"/><text class="sfl-l" x="868" y="448.5" font-size="12.5" text-anchor="middle">opens</text></g>
<g class="sfl-node" data-part="orch" tabindex="0" role="img" aria-label="Orchestrator agent" aria-describedby="sfl3w-orch-5"><desc id="sfl3w-orch-5">An agent chooses the next step. It takes work from requests and signals, runs preflight to propose a profile and scope for each task, and divides the work across agents. Nothing it decides authorizes itself.</desc><rect class="sfl-box sfl-agent sfl-o" x="180.5" y="16.5" width="319" height="39" rx="6"/><text class="sfl-t" x="192" y="41.6" font-size="15.5">Orchestrator agent</text></g>
<g class="sfl-node" data-part="input" tabindex="0" role="img" aria-label="Requests" aria-describedby="sfl3w-input-6"><desc id="sfl3w-input-6">Work people file, and tickets.</desc><rect class="sfl-box" x="16.5" y="16.5" width="131" height="39" rx="6"/><text class="sfl-t" x="28" y="41.6" font-size="15.5">Requests</text></g>
<g class="sfl-node" data-part="context" tabindex="0" role="img" aria-label="Context" aria-describedby="sfl3w-context-7"><desc id="sfl3w-context-7">What the orchestrator gathers in preflight: tickets, code and conversations.</desc><rect class="sfl-box" x="556.5" y="16.5" width="147" height="39" rx="6"/><text class="sfl-t" x="568" y="41.6" font-size="15.5">Context</text></g>
<g class="sfl-node" data-part="exec" tabindex="0" role="img" aria-label="Durable execution layer" aria-describedby="sfl3w-exec-8"><desc id="sfl3w-exec-8">The same durable system as at Level 2, starting each task’s agent only with its authorized scope. Only the execution layer starts agents; the orchestrator never does.</desc><rect class="sfl-box" x="180.5" y="88.5" width="319" height="39" rx="6"/><text class="sfl-t" x="192" y="113.6" font-size="15.5">Durable execution layer</text></g>
<g class="sfl-node" data-part="harness" tabindex="0" role="img" aria-label="Coding agent" aria-describedby="sfl3w-harness-11"><desc id="sfl3w-harness-11">The agent doing one task, with its own identity, profile and task scope. Only a new decision by the authorization service can widen its task.</desc><rect class="sfl-box sfl-plate" x="194.5" y="232.5" width="331" height="39" rx="6"/><text class="sfl-t" x="206" y="257.6" font-size="15.5">Coding agent</text></g>
<g class="sfl-node" data-part="inner" tabindex="0" role="img" aria-label="Inner loop" aria-describedby="sfl3w-inner-12"><desc id="sfl3w-inner-12">Assemble, build and verify, repeated until the work passes. The agent makes its own decisions inside this loop.</desc><rect class="sfl-hit" x="192" y="286" width="107.1" height="20"/><path class="sfl-glyph" d="M206.3 292.4 A5.625 5.625 0 1 1 200.1 290.7" fill="none"/><path class="sfl-glyph sfl-glyph-head" d="M203 289.7 L200.8 292.8 L199.3 288.6 z"/><text class="sfl-l" x="215.6" y="300.5" font-size="12.5">inner loop</text></g>
<g class="sfl-node" data-b="network" data-part="proxy" tabindex="0" role="img" aria-label="Egress proxy" aria-describedby="sfl3w-proxy-13"><desc id="sfl3w-proxy-13">Default-deny, one per task, with its own egress rules and task scope. Traffic between agents passes through the same enforcement as any other traffic.</desc><rect class="sfl-box sfl-b sfl-ghost" x="600.5" y="244.5" width="135" height="39" rx="6"/><rect class="sfl-box sfl-b sfl-ghost" x="594.5" y="238.5" width="135" height="39" rx="6"/><rect class="sfl-box sfl-b" x="588.5" y="232.5" width="135" height="39" rx="6"/><text class="sfl-t" x="600" y="257.6" font-size="15.5">Egress proxy</text><g class="sfl-pill" data-b="network" aria-hidden="true"><rect x="598" y="220.3" width="82.8" height="19.5" rx="9.75"/><text x="606" y="234.1" font-size="11.5">2 NETWORK</text></g></g>
<g class="sfl-node" data-b="identity" data-part="auth" tabindex="0" role="img" aria-label="Runtime authorization service" aria-describedby="sfl3w-auth-14"><desc id="sfl3w-auth-14">Decides what access each task gets, within the agent’s profile, any delegation and the organization’s policy. It records every grant and can revoke it. Part of the identity and access boundary.</desc><rect class="sfl-box sfl-b" x="596.5" y="88.5" width="387" height="39" rx="6"/><text class="sfl-t" x="608" y="113.6" font-size="15.5">Runtime authorization service</text><g class="sfl-pill" data-b="identity" aria-hidden="true"><rect x="606" y="76.3" width="171.8" height="19.5" rx="9.75"/><text x="614" y="90.1" font-size="11.5">4 IDENTITY AND ACCESS</text></g></g>
<g class="sfl-node" data-b="supply" data-part="firewall" tabindex="0" role="img" aria-label="Supply chain firewall" aria-describedby="sfl3w-firewall-17"><desc id="sfl3w-firewall-17">A dedicated admission point that serves only approved, scanned components and blocks compromised or disallowed ones. New versions wait out a cooldown.</desc><rect class="sfl-box sfl-b" x="764.5" y="204.5" width="207" height="39" rx="6"/><text class="sfl-t" x="776" y="229.6" font-size="15.5">Supply chain firewall</text><g class="sfl-pill" data-b="supply" aria-hidden="true"><rect x="774" y="192.3" width="119.8" height="19.5" rx="9.75"/><text x="782" y="206.1" font-size="11.5">3 SUPPLY CHAIN</text></g></g>
<g class="sfl-node" data-part="gateway" tabindex="0" role="img" aria-label="Model gateway" aria-describedby="sfl3w-gateway-18"><desc id="sfl3w-gateway-18">The enforcement point for inference. It routes model calls to approved models and applies rate limits, token and spend budgets and data-handling rules. It serves the supply chain and network boundaries without being one itself.</desc><rect class="sfl-box" x="764.5" y="260.5" width="207" height="39" rx="6"/><text class="sfl-t" x="776" y="285.6" font-size="15.5">Model gateway</text></g>
<g class="sfl-node" data-part="downstream" tabindex="0" role="img" aria-label="Downstream" aria-describedby="sfl3w-downstream-19"><desc id="sfl3w-downstream-19">Source control, APIs and MCP servers.</desc><rect class="sfl-box" x="764.5" y="316.5" width="207" height="39" rx="6"/><text class="sfl-t" x="776" y="341.6" font-size="15.5">Downstream</text></g>
<g class="sfl-node" data-part="monitor" tabindex="0" role="img" aria-label="Monitoring agent" aria-describedby="sfl3w-monitor-20"><desc id="sfl3w-monitor-20">Watches signals and work in progress, from outside the agents it watches, for thrash and drift. Like the orchestrator, it can flag and request but never grant or approve.</desc><rect class="sfl-box sfl-agent" x="180.5" y="348.5" width="359" height="39" rx="6"/><text class="sfl-t" x="192" y="373.6" font-size="15.5">Monitoring agent</text></g>
<g class="sfl-node" data-part="record" tabindex="0" role="img" aria-label="Tamper-evident record" aria-describedby="sfl3w-record-22"><desc id="sfl3w-record-22">Telemetry and evals across runs, and monitoring of running agents, out of any agent’s reach. Agents that drift or become ineffective are stopped.</desc><rect class="sfl-rec" x="180.5" y="404.5" width="523" height="39" rx="6"/><text class="sfl-t" x="192" y="429.6" font-size="15.5">Tamper-evident record</text></g>
<g class="sfl-node" data-part="pr" tabindex="0" role="img" aria-label="Pull request" aria-describedby="sfl3w-pr-24"><desc id="sfl3w-pr-24">Reviewed until ready, then approved like any other change.</desc><rect class="sfl-box" x="764.5" y="532.5" width="207" height="39" rx="6"/><text class="sfl-t" x="776" y="557.6" font-size="15.5">Pull request</text></g>
<g class="sfl-node" data-part="approval" tabindex="0" role="img" aria-label="Approval" aria-describedby="sfl3w-approval-25"><desc id="sfl3w-approval-25">Automatic or by a person, under the organization’s approval policy: by the change’s kind, risk, blast radius and reversibility, and the verification it has passed. Automatic approval is an option, never a requirement.</desc><rect class="sfl-box" x="588.5" y="532.5" width="159" height="39" rx="6"/><text class="sfl-t" x="600" y="557.6" font-size="15.5">Approval</text></g>
<g class="sfl-node" data-part="deploy" tabindex="0" role="img" aria-label="Deploy" aria-describedby="sfl3w-deploy-26"><desc id="sfl3w-deploy-26">Merged changes deploy under the same approval rules as any high-impact action, and can be rolled back.</desc><rect class="sfl-box" x="404.5" y="532.5" width="159" height="39" rx="6"/><text class="sfl-t" x="416" y="557.6" font-size="15.5">Deploy</text></g>
<g class="sfl-node" data-part="production" tabindex="0" role="img" aria-label="Production" aria-describedby="sfl3w-production-27"><desc id="sfl3w-production-27">Emits incidents and metrics, which come back as signals that start new work.</desc><rect class="sfl-box" x="180.5" y="532.5" width="191" height="39" rx="6"/><text class="sfl-t" x="192" y="557.6" font-size="15.5">Production</text></g>
<g class="sfl-node" data-part="signals" tabindex="0" role="img" aria-label="Signals" aria-describedby="sfl3w-signals-28"><desc id="sfl3w-signals-28">Events that start work without a person filing it: production incidents, scanner findings, eval results, tickets agents create. Signals are untrusted inputs.</desc><rect class="sfl-box" x="16.5" y="532.5" width="131" height="39" rx="6"/><text class="sfl-t" x="28" y="557.6" font-size="15.5">Signals</text></g>
<g class="sfl-node" data-part="loop" tabindex="0" role="img" aria-label="Outer loop" aria-describedby="sfl3w-loop-29"><desc id="sfl3w-loop-29">Review, evals and production feedback flow back to design. At Level 3 signals drive it too: incidents, findings and evals come back as work, and the orchestrator can propose changes to the factory that it can’t approve.</desc><rect class="sfl-plate" x="25.2" y="272.7" width="113.7" height="82.6"/><path class="sfl-glyph sfl-glyph-o" d="M89 279.6 A9.18 9.18 0 1 1 78.9 276.9" fill="none"/><path class="sfl-glyph sfl-glyph-o sfl-glyph-head" d="M83.6 275.1 L80.1 280.3 L77.6 273.4 z"/><text class="sfl-cap sfl-cap-o" x="82" y="310.9" font-size="12" text-anchor="middle">OUTER LOOP</text><text class="sfl-l" x="82" y="328.4" font-size="12.5" text-anchor="middle">signals start</text><text class="sfl-l" x="82" y="345.9" font-size="12.5" text-anchor="middle">new work</text></g>
<g class="sfl-key" aria-hidden="true"><rect class="sfl-sw sfl-sw-o" x="16" y="608.8" width="14.5" height="14.5" rx="3"/><text class="sfl-l" x="37.5" y="620.5" font-size="12.5">chooses the next step</text><rect class="sfl-sw sfl-sw-w" x="219.2625" y="608.8" width="14.5" height="14.5" rx="3"/><text class="sfl-l" x="240.8" y="620.5" font-size="12.5">agent execution</text></g>
<a class="sfl-link" href="/software-factory.pdf"><text class="sfl-l" x="984" y="620.5" font-size="12.5" text-anchor="end">Figure 5 in the paper</text></a>
</svg>
