<svg xmlns="http://www.w3.org/2000/svg" class="sfl-d" viewBox="0 0 1000 572" role="group" aria-label="A developer chooses the next step: they kick off each run of one coding agent, in a sandbox on their machine or a remote environment, and the pull request comes back to them for review, which is the outer loop. The agent proposes the scope it needs, the runtime authorization service decides, and a default-deny egress proxy enforces that decision on every request to the supply chain firewall, the model gateway and downstream. Pills name the boundaries as the paper numbers them: 1 sandbox, 2 network, 3 supply chain, 4 identity and access.">
<defs><marker id="sfl1w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="sfl-mk" d="M0 0 L10 5 L0 10 z"/></marker><marker id="sfl1w-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.3" markerHeight="5.3" orient="auto-start-reverse"><path class="sfl-mk sfl-mk-main" d="M0 0 L10 5 L0 10 z"/></marker><marker id="sfl1w-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="sfl-mk sfl-mk-g" d="M0 0 L10 5 L0 10 z"/></marker><marker id="sfl1w-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="sfl-mk sfl-mk-o" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<g data-frame="zone" data-zone="Developer’s machine"><rect class="sfl-zone" x="164.5" y="168.5" width="571" height="231" rx="8"/><g class="sfl-node" data-part="zone" tabindex="0" role="img" aria-label="Developer’s machine" aria-describedby="sfl1w-zone-1"><desc id="sfl1w-zone-1">Or a remote environment. The sandbox keeps writes to the task workspace and gives no access to the host filesystem.</desc><rect class="sfl-hit" x="168" y="172" width="188.7" height="26"/><text class="sfl-cap" x="176" y="186.6" font-size="12">DEVELOPER’S MACHINE</text></g></g>
<g data-frame="sandbox"><rect class="sfl-sb" x="180.5" y="204.5" width="359" height="111" rx="8"/><g class="sfl-node" data-part="sandbox" tabindex="0" role="img" aria-label="Sandbox" aria-describedby="sfl1w-sandbox-2"><desc id="sfl1w-sandbox-2">Where the agent’s code runs. It can reach the working repository, approved registries and the services the task needs, without inheriting everything the developer can access.</desc><g class="sfl-pill" data-b="sandbox" aria-hidden="true"><rect x="190" y="192.3" width="82.8" height="19.5" rx="9.75"/><text x="198" y="206.1" font-size="11.5">1 SANDBOX</text></g></g></g>
<g data-frame="behind" data-zone="Behind the proxy"><rect class="sfl-zone" x="752.5" y="168.5" width="231" height="203" rx="8"/><g class="sfl-node" data-part="behind" tabindex="0" role="img" aria-label="Behind the proxy" aria-describedby="sfl1w-behind-3"><desc id="sfl1w-behind-3">What the agent reaches, and only through the proxy, with only the operations the service authorized.</desc><rect class="sfl-hit" x="756" y="172" width="162.1" height="26"/><text class="sfl-cap" x="764" y="186.6" font-size="12">BEHIND THE PROXY</text></g></g>
<g data-frame="output" data-zone="Output"><rect class="sfl-zone" x="752.5" y="440.5" width="231" height="83" rx="8"/><g class="sfl-node" data-part="output" tabindex="0" role="img" aria-label="Output" aria-describedby="sfl1w-output-4"><desc id="sfl1w-output-4">What leaves the factory, and the review and approval it passes on the way.</desc><rect class="sfl-hit" x="756" y="444" width="73.3" height="26"/><text class="sfl-cap" x="764" y="458.6" font-size="12">OUTPUT</text></g></g>
<path class="sfl-wire sfl-main" d="M526 252 L588 252" marker-end="url(#sfl1w-m)"/>
<path class="sfl-wire" d="M724 252 L744 252"/>
<path class="sfl-wire" d="M744 224 V336"/>
<path class="sfl-wire" d="M744 224 L764 224" marker-end="url(#sfl1w-a)"/>
<path class="sfl-wire" d="M744 280 L764 280" marker-end="url(#sfl1w-a)"/>
<path class="sfl-wire" d="M744 336 L764 336" marker-end="url(#sfl1w-a)"/>
<path class="sfl-wire sfl-loop" d="M764 492 L82 492 L82 68 L200 68 L200 56" marker-end="url(#sfl1w-o)"/>
<g class="sfl-node sfl-edge" data-part="kicks" tabindex="0" role="img" aria-label="kicks off each run" aria-describedby="sfl1w-kicks-6"><desc id="sfl1w-kicks-6">The developer starts each run through the agent harness, which is the execution layer at Level 1.</desc><path class="sfl-hit" d="M340 56 L340 204"/><path class="sfl-wire" d="M340 56 L340 204" marker-end="url(#sfl1w-a)"/><rect class="sfl-plate" x="267.4" y="142.8" width="145.2" height="18.5"/><text class="sfl-l" x="340" y="156.5" font-size="12.5" text-anchor="middle">kicks off each run</text></g>
<g class="sfl-node sfl-edge" data-part="proposes" tabindex="0" role="img" aria-label="proposes scope" aria-describedby="sfl1w-proposes-11"><desc id="sfl1w-proposes-11">The agent proposes the scope its task needs. It can propose; it can’t grant.</desc><path class="sfl-hit" d="M520 204 L520 108 L596 108"/><path class="sfl-wire" d="M520 204 L520 108 L596 108" marker-end="url(#sfl1w-a)"/><rect class="sfl-plate" x="462.4" y="142.8" width="115.2" height="18.5"/><text class="sfl-l" x="520" y="156.5" font-size="12.5" text-anchor="middle">proposes scope</text></g>
<g class="sfl-node sfl-edge" data-part="authorized" tabindex="0" role="img" aria-label="authorized scope" aria-describedby="sfl1w-authorized-12"><desc id="sfl1w-authorized-12">The service’s decision, which the proxy enforces: it blocks what the service hasn’t authorized. Only a new decision can widen a task.</desc><path class="sfl-hit" d="M690 128 L690 232"/><path class="sfl-wire sfl-grant" d="M690 128 L690 232" marker-end="url(#sfl1w-g)"/><rect class="sfl-plate" x="624.9" y="142.8" width="130.2" height="18.5"/><text class="sfl-l" x="690" y="156.5" font-size="12.5" text-anchor="middle">authorized scope</text></g>
<g class="sfl-node sfl-edge" data-part="opens" tabindex="0" role="img" aria-label="opens" aria-describedby="sfl1w-opens-17"><desc id="sfl1w-opens-17">The agent opens its pull request in source control, through the proxy.</desc><path class="sfl-hit" d="M868 356 L868 472"/><path class="sfl-wire" d="M868 356 L868 472" marker-end="url(#sfl1w-a)"/><rect class="sfl-plate" x="844.2" y="404.8" width="47.6" height="18.5"/><text class="sfl-l" x="868" y="418.5" font-size="12.5" text-anchor="middle">opens</text></g>
<g class="sfl-node" data-part="orch" tabindex="0" role="img" aria-label="Developer" aria-describedby="sfl1w-orch-5"><desc id="sfl1w-orch-5">Chooses the next step. The developer kicks off each run, reviews the result instead of approving each command, and drives the outer loop.</desc><rect class="sfl-box sfl-o" x="180.5" y="16.5" width="319" height="39" rx="6"/><text class="sfl-t" x="192" y="41.6" font-size="15.5">Developer</text></g>
<g class="sfl-node" data-part="harness" tabindex="0" role="img" aria-label="Agent harness" aria-describedby="sfl1w-harness-7"><desc id="sfl1w-harness-7">The runtime that runs the coding agent and loads the skills, tools, hooks and context files from its profile. The agent is untrusted and holds no credentials.</desc><rect class="sfl-box sfl-plate" x="194.5" y="232.5" width="331" height="39" rx="6"/><text class="sfl-t" x="206" y="257.6" font-size="15.5">Agent harness</text></g>
<g class="sfl-node" data-part="inner" tabindex="0" role="img" aria-label="Inner loop" aria-describedby="sfl1w-inner-8"><desc id="sfl1w-inner-8">Assemble, build and verify, repeated until the work passes. The agent makes its own decisions inside this loop.</desc><rect class="sfl-hit" x="192" y="286" width="107.1" height="20"/><path class="sfl-glyph" d="M206.3 292.4 A5.625 5.625 0 1 1 200.1 290.7" fill="none"/><path class="sfl-glyph sfl-glyph-head" d="M203 289.7 L200.8 292.8 L199.3 288.6 z"/><text class="sfl-l" x="215.6" y="300.5" font-size="12.5">inner loop</text></g>
<g class="sfl-node" data-b="network" data-part="proxy" tabindex="0" role="img" aria-label="Egress proxy" aria-describedby="sfl1w-proxy-9"><desc id="sfl1w-proxy-9">Default-deny. All of the sandbox’s traffic passes through it, in both directions. It blocks what the authorization service hasn’t authorized and attaches credentials, so the agent never holds them.</desc><rect class="sfl-box sfl-b" x="588.5" y="232.5" width="135" height="39" rx="6"/><text class="sfl-t" x="600" y="257.6" font-size="15.5">Egress proxy</text><g class="sfl-pill" data-b="network" aria-hidden="true"><rect x="598" y="220.3" width="82.8" height="19.5" rx="9.75"/><text x="606" y="234.1" font-size="11.5">2 NETWORK</text></g></g>
<g class="sfl-node" data-b="identity" data-part="auth" tabindex="0" role="img" aria-label="Runtime authorization service" aria-describedby="sfl1w-auth-10"><desc id="sfl1w-auth-10">Decides what access each task gets, within the agent’s profile, any delegation and the organization’s policy. It records every grant and can revoke it. Part of the identity and access boundary.</desc><rect class="sfl-box sfl-b" x="596.5" y="88.5" width="387" height="39" rx="6"/><text class="sfl-t" x="608" y="113.6" font-size="15.5">Runtime authorization service</text><g class="sfl-pill" data-b="identity" aria-hidden="true"><rect x="606" y="76.3" width="171.8" height="19.5" rx="9.75"/><text x="614" y="90.1" font-size="11.5">4 IDENTITY AND ACCESS</text></g></g>
<g class="sfl-node" data-b="supply" data-part="firewall" tabindex="0" role="img" aria-label="Supply chain firewall" aria-describedby="sfl1w-firewall-13"><desc id="sfl1w-firewall-13">A dedicated admission point that serves only approved, scanned components and blocks compromised or disallowed ones. New versions wait out a cooldown.</desc><rect class="sfl-box sfl-b" x="764.5" y="204.5" width="207" height="39" rx="6"/><text class="sfl-t" x="776" y="229.6" font-size="15.5">Supply chain firewall</text><g class="sfl-pill" data-b="supply" aria-hidden="true"><rect x="774" y="192.3" width="119.8" height="19.5" rx="9.75"/><text x="782" y="206.1" font-size="11.5">3 SUPPLY CHAIN</text></g></g>
<g class="sfl-node" data-part="gateway" tabindex="0" role="img" aria-label="Model gateway" aria-describedby="sfl1w-gateway-14"><desc id="sfl1w-gateway-14">The enforcement point for inference. It routes model calls to approved models and applies rate limits, token and spend budgets and data-handling rules. It serves the supply chain and network boundaries without being one itself.</desc><rect class="sfl-box" x="764.5" y="260.5" width="207" height="39" rx="6"/><text class="sfl-t" x="776" y="285.6" font-size="15.5">Model gateway</text></g>
<g class="sfl-node" data-part="downstream" tabindex="0" role="img" aria-label="Downstream" aria-describedby="sfl1w-downstream-15"><desc id="sfl1w-downstream-15">Source control, APIs and MCP servers.</desc><rect class="sfl-box" x="764.5" y="316.5" width="207" height="39" rx="6"/><text class="sfl-t" x="776" y="341.6" font-size="15.5">Downstream</text></g>
<g class="sfl-node" data-part="record" tabindex="0" role="img" aria-label="Tamper-evident record" aria-describedby="sfl1w-record-16"><desc id="sfl1w-record-16">Harness logs plus identity and proxy records, reviewed by the developer. Every run leaves a record out of any agent’s reach, or fails closed.</desc><rect class="sfl-rec" x="180.5" y="344.5" width="523" height="39" rx="6"/><text class="sfl-t" x="192" y="369.6" font-size="15.5">Tamper-evident record</text></g>
<g class="sfl-node" data-part="pr" tabindex="0" role="img" aria-label="Pull request" aria-describedby="sfl1w-pr-18"><desc id="sfl1w-pr-18">Reviewed by the developer, who drives the next run.</desc><rect class="sfl-box" x="764.5" y="472.5" width="207" height="39" rx="6"/><text class="sfl-t" x="776" y="497.6" font-size="15.5">Pull request</text></g>
<g class="sfl-node" data-part="loop" tabindex="0" role="img" aria-label="Outer loop" aria-describedby="sfl1w-loop-19"><desc id="sfl1w-loop-19">Review, evals and production feedback flow back to design. At Level 1 the developer drives it: the pull request comes back to them, and they start the next run and update the configuration.</desc><rect class="sfl-plate" x="2.6" y="242.7" width="158.7" height="82.6"/><path class="sfl-glyph sfl-glyph-o" d="M89 249.6 A9.18 9.18 0 1 1 78.9 246.9" fill="none"/><path class="sfl-glyph sfl-glyph-o sfl-glyph-head" d="M83.6 245.1 L80.1 250.3 L77.6 243.4 z"/><text class="sfl-cap sfl-cap-o" x="82" y="280.9" font-size="12" text-anchor="middle">OUTER LOOP</text><text class="sfl-l" x="82" y="298.4" font-size="12.5" text-anchor="middle">the developer</text><text class="sfl-l" x="82" y="315.9" font-size="12.5" text-anchor="middle">drives the next run</text></g>
<g class="sfl-key" aria-hidden="true"><rect class="sfl-sw sfl-sw-o" x="16" y="548.8" width="14.5" height="14.5" rx="3"/><text class="sfl-l" x="37.5" y="560.5" font-size="12.5">chooses the next step</text><rect class="sfl-sw sfl-sw-w" x="219.2625" y="548.8" width="14.5" height="14.5" rx="3"/><text class="sfl-l" x="240.8" y="560.5" font-size="12.5">agent execution</text></g>
<a class="sfl-link" href="/software-factory.pdf"><text class="sfl-l" x="984" y="560.5" font-size="12.5" text-anchor="end">Figure 3 in the paper</text></a>
</svg>
