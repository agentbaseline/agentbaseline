<svg xmlns="http://www.w3.org/2000/svg" class="sfl-d" viewBox="0 0 356 1090" role="group" aria-label="A predefined workflow chooses the next step: a request, event, schedule or ticket starts it, it schedules each run on a durable execution layer, and that starts the agent in a fresh sandbox behind its own proxy. The pull request goes through approval to merge, and review feedback drives the next run, which is the outer loop. The authorization service, firewall, gateway and downstream are as at Level 1. Pills name the boundaries as the paper numbers them: 1 sandbox, 2 network, 3 supply chain, 4 identity and access.">
<defs><marker id="sfl2n-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="sfl-mk" d="M0 0 L10 5 L0 10 z"/></marker><marker id="sfl2n-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.9" markerHeight="4.9" orient="auto-start-reverse"><path class="sfl-mk sfl-mk-main" d="M0 0 L10 5 L0 10 z"/></marker><marker id="sfl2n-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="sfl-mk sfl-mk-g" d="M0 0 L10 5 L0 10 z"/></marker><marker id="sfl2n-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="sfl-mk sfl-mk-o" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<g data-frame="zone" data-zone="The factory"><rect class="sfl-zone" x="28.5" y="276.5" width="305" height="211" rx="8"/><g class="sfl-node" data-part="zone" tabindex="0" role="img" aria-label="The factory" aria-describedby="sfl2n-zone-7"><desc id="sfl2n-zone-7">A shared service with its own identity, not reachable from outside. Improvements to it reach everyone using it.</desc><rect class="sfl-hit" x="32" y="280" width="103.5" height="24.5"/><text class="sfl-cap" x="38" y="293.6" font-size="10.5">THE FACTORY</text></g></g>
<g data-frame="sandbox"><rect class="sfl-sb sfl-ghost" x="52.5" y="324.5" width="173" height="95" rx="6"/><rect class="sfl-sb sfl-ghost" x="46.5" y="318.5" width="173" height="95" rx="6"/><rect class="sfl-sb" x="40.5" y="312.5" width="173" height="95" rx="8"/><g class="sfl-node" data-part="sandbox" tabindex="0" role="img" aria-label="Sandbox" aria-describedby="sfl2n-sandbox-8"><desc id="sfl2n-sandbox-8">A fresh sandbox for every run, on shared infrastructure, started from an approved image and destroyed when the run ends.</desc><g class="sfl-pill" data-b="sandbox" aria-hidden="true"><rect x="127" y="300.8" width="77" height="18.5" rx="9.25"/><text x="135" y="313.8" font-size="10.5">1 SANDBOX</text></g></g></g>
<g data-frame="behind" data-zone="Behind the proxy"><rect class="sfl-zone" x="28.5" y="520.5" width="305" height="187" rx="8"/><g class="sfl-node" data-part="behind" tabindex="0" role="img" aria-label="Behind the proxy" aria-describedby="sfl2n-behind-15"><desc id="sfl2n-behind-15">What the agent reaches, and only through the proxy, with only the operations the service authorized.</desc><rect class="sfl-hit" x="32" y="524" width="142.3" height="24.5"/><text class="sfl-cap" x="38" y="537.6" font-size="10.5">BEHIND THE PROXY</text></g></g>
<g data-frame="output" data-zone="Output"><rect class="sfl-zone" x="28.5" y="740.5" width="305" height="199" rx="8"/><g class="sfl-node" data-part="output" tabindex="0" role="img" aria-label="Output" aria-describedby="sfl2n-output-19"><desc id="sfl2n-output-19">What leaves the factory, and the review and approval it passes on the way.</desc><rect class="sfl-hit" x="32" y="744" width="64.6" height="24.5"/><text class="sfl-cap" x="38" y="757.6" font-size="10.5">OUTPUT</text></g></g>
<path class="sfl-wire" d="M190 44 L190 68" marker-end="url(#sfl2n-a)"/>
<path class="sfl-wire sfl-main" d="M202 354 L232 354" marker-end="url(#sfl2n-m)"/>
<path class="sfl-wire" d="M340 354 H348 V678"/>
<path class="sfl-wire" d="M348 574 L300 574" marker-end="url(#sfl2n-a)"/>
<path class="sfl-wire" d="M348 626 L300 626" marker-end="url(#sfl2n-a)"/>
<path class="sfl-wire" d="M348 678 L300 678" marker-end="url(#sfl2n-a)"/>
<path class="sfl-wire" d="M170 808 L170 832" marker-end="url(#sfl2n-a)"/>
<path class="sfl-wire" d="M170 868 L170 892" marker-end="url(#sfl2n-a)"/>
<path class="sfl-wire sfl-loop" d="M170 928 L170 956 L14 956 L14 86 L40 86" marker-end="url(#sfl2n-o)"/>
<g class="sfl-node sfl-edge" data-part="schedules" tabindex="0" role="img" aria-label="schedules runs" aria-describedby="sfl2n-schedules-4"><desc id="sfl2n-schedules-4">The workflow schedules each run on the execution layer. It never starts agents itself.</desc><path class="sfl-hit" d="M56 104 L56 136"/><path class="sfl-wire" d="M56 104 L56 136" marker-end="url(#sfl2n-a)"/><rect class="sfl-plate" x="48.7" y="111.5" width="102.6" height="17"/><text class="sfl-l" x="100" y="124" font-size="11" text-anchor="middle">schedules runs</text></g>
<g class="sfl-node sfl-edge" data-part="starts" tabindex="0" role="img" aria-label="starts the agent" aria-describedby="sfl2n-starts-6"><desc id="sfl2n-starts-6">The execution layer starts the agent in a fresh sandbox with its profile and only its authorized scope, and won’t start it if a required enforcement point is down.</desc><path class="sfl-hit" d="M56 172 L56 312"/><path class="sfl-wire" d="M56 172 L56 312" marker-end="url(#sfl2n-a)"/><rect class="sfl-plate" x="46.1" y="179.5" width="115.8" height="17"/><text class="sfl-l" x="104" y="192" font-size="11" text-anchor="middle">starts the agent</text></g>
<g class="sfl-node sfl-edge" data-part="proposes" tabindex="0" role="img" aria-label="proposes scope" aria-describedby="sfl2n-proposes-12"><desc id="sfl2n-proposes-12">The agent proposes the scope its task needs. It can propose; it can’t grant.</desc><path class="sfl-hit" d="M156 312 L156 240"/><path class="sfl-wire" d="M156 312 L156 240" marker-end="url(#sfl2n-a)"/><rect class="sfl-plate" x="104.7" y="249.5" width="102.6" height="17"/><text class="sfl-l" x="156" y="262" font-size="11" text-anchor="middle">proposes scope</text></g>
<g class="sfl-node sfl-edge" data-part="authorized" tabindex="0" role="img" aria-label="authorized scope" aria-describedby="sfl2n-authorized-13"><desc id="sfl2n-authorized-13">The service’s decision, which the proxy enforces: it blocks what the service hasn’t authorized. Only a new decision can widen a task.</desc><path class="sfl-hit" d="M326 240 L326 336"/><path class="sfl-wire sfl-grant" d="M326 240 L326 336" marker-end="url(#sfl2n-g)"/><text class="sfl-l" x="320" y="262" font-size="11" text-anchor="end">authorized scope</text></g>
<g class="sfl-node sfl-edge" data-part="opens" tabindex="0" role="img" aria-label="opens" aria-describedby="sfl2n-opens-20"><desc id="sfl2n-opens-20">The agent opens its pull request in source control, through the proxy.</desc><path class="sfl-hit" d="M170 696 L170 772"/><path class="sfl-wire" d="M170 696 L170 772" marker-end="url(#sfl2n-a)"/><rect class="sfl-plate" x="148.5" y="725.5" width="43.1" height="17"/><text class="sfl-l" x="170" y="738" font-size="11" text-anchor="middle">opens</text></g>
<g class="sfl-node" data-part="input" tabindex="0" role="img" aria-label="Request" aria-describedby="sfl2n-input-1"><desc id="sfl2n-input-1">A request, event, schedule or ticket starts a workflow.</desc><rect class="sfl-box" x="40.5" y="8.5" width="299" height="35" rx="6"/><text class="sfl-t" x="50" y="30.7" font-size="13">Request</text></g>
<g class="sfl-node" data-part="orch" tabindex="0" role="img" aria-label="Workflow" aria-describedby="sfl2n-orch-2"><desc id="sfl2n-orch-2">A predefined workflow chooses the next step. It turns requests and tickets into runs, acts for the requester, and makes the factory a shared service.</desc><rect class="sfl-box sfl-o" x="40.5" y="68.5" width="299" height="35" rx="6"/><text class="sfl-t" x="50" y="90.7" font-size="13">Workflow</text></g>
<g class="sfl-node" data-part="exec" tabindex="0" role="img" aria-label="Durable execution layer" aria-describedby="sfl2n-exec-3"><desc id="sfl2n-exec-3">A durable system such as a CI/CD pipeline, a step runner or a durable execution engine. It starts each run’s agent with its profile and only the access the service granted, retries failures and can stop any run.</desc><rect class="sfl-box" x="40.5" y="136.5" width="299" height="35" rx="6"/><text class="sfl-t" x="50" y="158.7" font-size="13">Durable execution layer</text></g>
<g class="sfl-node" data-b="identity" data-part="auth" tabindex="0" role="img" aria-label="Runtime authorization service" aria-describedby="sfl2n-auth-5"><desc id="sfl2n-auth-5">Decides what access each task gets, within the agent’s profile, any delegation and the organization’s policy. It records every grant and can revoke it. Part of the identity and access boundary.</desc><rect class="sfl-box sfl-b" x="92.5" y="204.5" width="247" height="35" rx="6"/><text class="sfl-t" x="102" y="226.7" font-size="13">Runtime authorization service</text><g class="sfl-pill" data-b="identity" aria-hidden="true"><rect x="102" y="192.8" width="158.2" height="18.5" rx="9.25"/><text x="110" y="205.8" font-size="10.5">4 IDENTITY AND ACCESS</text></g></g>
<g class="sfl-node" data-part="harness" tabindex="0" role="img" aria-label="Agent harness" aria-describedby="sfl2n-harness-9"><desc id="sfl2n-harness-9">The same harness as at Level 1, configured by its profile: the agent is untrusted and holds no credentials.</desc><rect class="sfl-box sfl-plate" x="52.5" y="336.5" width="149" height="35" rx="6"/><text class="sfl-t" x="62" y="358.7" font-size="13">Agent harness</text></g>
<g class="sfl-node" data-part="inner" tabindex="0" role="img" aria-label="Inner loop" aria-describedby="sfl2n-inner-10"><desc id="sfl2n-inner-10">Assemble, build and verify, repeated until the work passes. The agent makes its own decisions inside this loop.</desc><rect class="sfl-hit" x="50" y="382" width="98.1" height="20"/><path class="sfl-glyph" d="M63.8 388.8 A4.95 4.95 0 1 1 58.3 387.3" fill="none"/><path class="sfl-glyph sfl-glyph-head" d="M60.9 386.4 L59 389.2 L57.6 385.5 z"/><text class="sfl-l" x="73" y="396" font-size="11">inner loop</text></g>
<g class="sfl-node" data-b="network" data-part="proxy" tabindex="0" role="img" aria-label="Egress proxy" aria-describedby="sfl2n-proxy-11"><desc id="sfl2n-proxy-11">Default-deny, one per agent, with rules from its profile. It blocks what the authorization service hasn’t authorized and attaches credentials, so the agent never holds them.</desc><rect class="sfl-box sfl-b sfl-ghost" x="244.5" y="348.5" width="107" height="35" rx="6"/><rect class="sfl-box sfl-b sfl-ghost" x="238.5" y="342.5" width="107" height="35" rx="6"/><rect class="sfl-box sfl-b" x="232.5" y="336.5" width="107" height="35" rx="6"/><text class="sfl-t" x="242" y="358.7" font-size="13">Egress proxy</text><g class="sfl-pill" data-b="network" aria-hidden="true"><rect x="242" y="324.8" width="77" height="18.5" rx="9.25"/><text x="250" y="337.8" font-size="10.5">2 NETWORK</text></g></g>
<g class="sfl-node" data-part="record" tabindex="0" role="img" aria-label="Tamper-evident record" aria-describedby="sfl2n-record-14"><desc id="sfl2n-record-14">Records from all four boundaries, collected in one place and linked by run, out of any agent’s reach. Evals track output quality across runs.</desc><rect class="sfl-rec" x="40.5" y="440.5" width="295" height="35" rx="6"/><text class="sfl-t" x="50" y="462.7" font-size="13">Tamper-evident record</text></g>
<g class="sfl-node" data-b="supply" data-part="firewall" tabindex="0" role="img" aria-label="Supply chain firewall" aria-describedby="sfl2n-firewall-16"><desc id="sfl2n-firewall-16">A dedicated admission point that serves only approved, scanned components and blocks compromised or disallowed ones. New versions wait out a cooldown.</desc><rect class="sfl-box sfl-b" x="40.5" y="556.5" width="259" height="35" rx="6"/><text class="sfl-t" x="50" y="578.7" font-size="13">Supply chain firewall</text><g class="sfl-pill" data-b="supply" aria-hidden="true"><rect x="50" y="544.8" width="110.8" height="18.5" rx="9.25"/><text x="58" y="557.8" font-size="10.5">3 SUPPLY CHAIN</text></g></g>
<g class="sfl-node" data-part="gateway" tabindex="0" role="img" aria-label="Model gateway" aria-describedby="sfl2n-gateway-17"><desc id="sfl2n-gateway-17">The enforcement point for inference. It routes model calls to approved models and applies rate limits, token and spend budgets and data-handling rules. It serves the supply chain and network boundaries without being one itself.</desc><rect class="sfl-box" x="40.5" y="608.5" width="259" height="35" rx="6"/><text class="sfl-t" x="50" y="630.7" font-size="13">Model gateway</text></g>
<g class="sfl-node" data-part="downstream" tabindex="0" role="img" aria-label="Downstream" aria-describedby="sfl2n-downstream-18"><desc id="sfl2n-downstream-18">Source control, APIs and MCP servers.</desc><rect class="sfl-box" x="40.5" y="660.5" width="259" height="35" rx="6"/><text class="sfl-t" x="50" y="682.7" font-size="13">Downstream</text></g>
<g class="sfl-node" data-part="pr" tabindex="0" role="img" aria-label="Pull request" aria-describedby="sfl2n-pr-21"><desc id="sfl2n-pr-21">Reviewed until ready. Review feedback drives the next run.</desc><rect class="sfl-box" x="40.5" y="772.5" width="259" height="35" rx="6"/><text class="sfl-t" x="50" y="794.7" font-size="13">Pull request</text></g>
<g class="sfl-node" data-part="approval" tabindex="0" role="img" aria-label="Approval" aria-describedby="sfl2n-approval-22"><desc id="sfl2n-approval-22">Automatic or by a person, under the organization’s approval policy: by the change’s kind, risk, blast radius and reversibility, and the verification it has passed. Automatic approval is an option, never a requirement.</desc><rect class="sfl-box" x="40.5" y="832.5" width="259" height="35" rx="6"/><text class="sfl-t" x="50" y="854.7" font-size="13">Approval</text></g>
<g class="sfl-node" data-part="merge" tabindex="0" role="img" aria-label="Merge" aria-describedby="sfl2n-merge-23"><desc id="sfl2n-merge-23">Approved changes merge. Evals and run metrics across many runs show where the factory needs to improve.</desc><rect class="sfl-box" x="40.5" y="892.5" width="259" height="35" rx="6"/><text class="sfl-t" x="50" y="914.7" font-size="13">Merge</text></g>
<g class="sfl-node" data-part="loop" tabindex="0" role="img" aria-label="Outer loop" aria-describedby="sfl2n-loop-24"><desc id="sfl2n-loop-24">Review, evals and production feedback flow back to design. At Level 2 teams drive it with review and evals: feedback drives the next run until the pull request is ready.</desc><rect class="sfl-plate" x="39.2" y="962.9" width="141.6" height="74.2"/><path class="sfl-glyph sfl-glyph-o" d="M116.2 969.2 A8.0325 8.0325 0 1 1 107.3 966.8" fill="none"/><path class="sfl-glyph sfl-glyph-o sfl-glyph-head" d="M111.4 965.3 L108.4 969.8 L106.2 963.8 z"/><text class="sfl-cap sfl-cap-o" x="110" y="997.4" font-size="10.5" text-anchor="middle">OUTER LOOP</text><text class="sfl-l" x="110" y="1012.8" font-size="11" text-anchor="middle">review feedback</text><text class="sfl-l" x="110" y="1028.2" font-size="11" text-anchor="middle">drives the next run</text></g>
<g class="sfl-key" aria-hidden="true"><rect class="sfl-sw sfl-sw-o" x="40" y="1049.5" width="13" height="13" rx="3"/><text class="sfl-l" x="60" y="1060" font-size="11">chooses the next step</text><rect class="sfl-sw sfl-sw-w" x="222.831" y="1049.5" width="13" height="13" rx="3"/><text class="sfl-l" x="242.8" y="1060" font-size="11">agent execution</text></g>
<a class="sfl-link" href="/software-factory.pdf"><text class="sfl-l" x="340" y="1082" font-size="11" text-anchor="end">Figure 4 in the paper</text></a>
</svg>
