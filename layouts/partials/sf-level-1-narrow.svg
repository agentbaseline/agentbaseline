<svg xmlns="http://www.w3.org/2000/svg" class="sfl-d" viewBox="0 0 356 830" role="group" aria-label="A developer chooses the next step: they kick off each run of one coding agent, in a sandbox on their machine or a remote environment, and the pull request comes back to them for review, which is the outer loop. The agent proposes the scope it needs, the runtime authorization service decides, and a default-deny egress proxy enforces that decision on every request to the supply chain firewall, the model gateway and downstream. Pills name the boundaries as the paper numbers them: 1 sandbox, 2 network, 3 supply chain, 4 identity and access.">
<defs><marker id="sfl1n-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="sfl-mk" d="M0 0 L10 5 L0 10 z"/></marker><marker id="sfl1n-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.9" markerHeight="4.9" orient="auto-start-reverse"><path class="sfl-mk sfl-mk-main" d="M0 0 L10 5 L0 10 z"/></marker><marker id="sfl1n-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="sfl-mk sfl-mk-g" d="M0 0 L10 5 L0 10 z"/></marker><marker id="sfl1n-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="sfl-mk sfl-mk-o" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<g data-frame="zone" data-zone="Developer’s machine"><rect class="sfl-zone" x="28.5" y="148.5" width="305" height="199" rx="8"/><g class="sfl-node" data-part="zone" tabindex="0" role="img" aria-label="Developer’s machine" aria-describedby="sfl1n-zone-4"><desc id="sfl1n-zone-4">Or a remote environment. The sandbox keeps writes to the task workspace and gives no access to the host filesystem.</desc><rect class="sfl-hit" x="32" y="152" width="165.6" height="24.5"/><text class="sfl-cap" x="38" y="165.6" font-size="10.5">DEVELOPER’S MACHINE</text></g></g>
<g data-frame="sandbox"><rect class="sfl-sb" x="40.5" y="184.5" width="173" height="95" rx="8"/><g class="sfl-node" data-part="sandbox" tabindex="0" role="img" aria-label="Sandbox" aria-describedby="sfl1n-sandbox-5"><desc id="sfl1n-sandbox-5">Where the agent’s code runs. It can reach the working repository, approved registries and the services the task needs, without inheriting everything the developer can access.</desc><g class="sfl-pill" data-b="sandbox" aria-hidden="true"><rect x="127" y="172.8" width="77" height="18.5" rx="9.25"/><text x="135" y="185.8" font-size="10.5">1 SANDBOX</text></g></g></g>
<g data-frame="behind" data-zone="Behind the proxy"><rect class="sfl-zone" x="28.5" y="380.5" width="305" height="187" rx="8"/><g class="sfl-node" data-part="behind" tabindex="0" role="img" aria-label="Behind the proxy" aria-describedby="sfl1n-behind-12"><desc id="sfl1n-behind-12">What the agent reaches, and only through the proxy, with only the operations the service authorized.</desc><rect class="sfl-hit" x="32" y="384" width="142.3" height="24.5"/><text class="sfl-cap" x="38" y="397.6" font-size="10.5">BEHIND THE PROXY</text></g></g>
<g data-frame="output" data-zone="Output"><rect class="sfl-zone" x="28.5" y="600.5" width="305" height="79" rx="8"/><g class="sfl-node" data-part="output" tabindex="0" role="img" aria-label="Output" aria-describedby="sfl1n-output-16"><desc id="sfl1n-output-16">What leaves the factory, and the review and approval it passes on the way.</desc><rect class="sfl-hit" x="32" y="604" width="64.6" height="24.5"/><text class="sfl-cap" x="38" y="617.6" font-size="10.5">OUTPUT</text></g></g>
<path class="sfl-wire sfl-main" d="M202 226 L232 226" marker-end="url(#sfl1n-m)"/>
<path class="sfl-wire" d="M340 226 H348 V538"/>
<path class="sfl-wire" d="M348 434 L300 434" marker-end="url(#sfl1n-a)"/>
<path class="sfl-wire" d="M348 486 L300 486" marker-end="url(#sfl1n-a)"/>
<path class="sfl-wire" d="M348 538 L300 538" marker-end="url(#sfl1n-a)"/>
<path class="sfl-wire sfl-loop" d="M170 668 L170 696 L14 696 L14 26 L40 26" marker-end="url(#sfl1n-o)"/>
<g class="sfl-node sfl-edge" data-part="kicks" tabindex="0" role="img" aria-label="kicks off each run" aria-describedby="sfl1n-kicks-3"><desc id="sfl1n-kicks-3">The developer starts each run through the agent harness, which is the execution layer at Level 1.</desc><path class="sfl-hit" d="M56 44 L56 184"/><path class="sfl-wire" d="M56 44 L56 184" marker-end="url(#sfl1n-a)"/><rect class="sfl-plate" x="39.5" y="51.5" width="129" height="17"/><text class="sfl-l" x="104" y="64" font-size="11" text-anchor="middle">kicks off each run</text></g>
<g class="sfl-node sfl-edge" data-part="proposes" tabindex="0" role="img" aria-label="proposes scope" aria-describedby="sfl1n-proposes-9"><desc id="sfl1n-proposes-9">The agent proposes the scope its task needs. It can propose; it can’t grant.</desc><path class="sfl-hit" d="M156 184 L156 112"/><path class="sfl-wire" d="M156 184 L156 112" marker-end="url(#sfl1n-a)"/><rect class="sfl-plate" x="104.7" y="121.5" width="102.6" height="17"/><text class="sfl-l" x="156" y="134" font-size="11" text-anchor="middle">proposes scope</text></g>
<g class="sfl-node sfl-edge" data-part="authorized" tabindex="0" role="img" aria-label="authorized scope" aria-describedby="sfl1n-authorized-10"><desc id="sfl1n-authorized-10">The service’s decision, which the proxy enforces: it blocks what the service hasn’t authorized. Only a new decision can widen a task.</desc><path class="sfl-hit" d="M326 112 L326 208"/><path class="sfl-wire sfl-grant" d="M326 112 L326 208" marker-end="url(#sfl1n-g)"/><text class="sfl-l" x="320" y="134" font-size="11" text-anchor="end">authorized scope</text></g>
<g class="sfl-node sfl-edge" data-part="opens" tabindex="0" role="img" aria-label="opens" aria-describedby="sfl1n-opens-17"><desc id="sfl1n-opens-17">The agent opens its pull request in source control, through the proxy.</desc><path class="sfl-hit" d="M170 556 L170 632"/><path class="sfl-wire" d="M170 556 L170 632" marker-end="url(#sfl1n-a)"/><rect class="sfl-plate" x="148.5" y="585.5" width="43.1" height="17"/><text class="sfl-l" x="170" y="598" font-size="11" text-anchor="middle">opens</text></g>
<g class="sfl-node" data-part="orch" tabindex="0" role="img" aria-label="Developer" aria-describedby="sfl1n-orch-1"><desc id="sfl1n-orch-1">Chooses the next step. The developer kicks off each run, reviews the result instead of approving each command, and drives the outer loop.</desc><rect class="sfl-box sfl-o" x="40.5" y="8.5" width="299" height="35" rx="6"/><text class="sfl-t" x="50" y="30.7" font-size="13">Developer</text></g>
<g class="sfl-node" data-b="identity" data-part="auth" tabindex="0" role="img" aria-label="Runtime authorization service" aria-describedby="sfl1n-auth-2"><desc id="sfl1n-auth-2">Decides what access each task gets, within the agent’s profile, any delegation and the organization’s policy. It records every grant and can revoke it. Part of the identity and access boundary.</desc><rect class="sfl-box sfl-b" x="92.5" y="76.5" width="247" height="35" rx="6"/><text class="sfl-t" x="102" y="98.7" font-size="13">Runtime authorization service</text><g class="sfl-pill" data-b="identity" aria-hidden="true"><rect x="102" y="64.8" width="158.2" height="18.5" rx="9.25"/><text x="110" y="77.8" font-size="10.5">4 IDENTITY AND ACCESS</text></g></g>
<g class="sfl-node" data-part="harness" tabindex="0" role="img" aria-label="Agent harness" aria-describedby="sfl1n-harness-6"><desc id="sfl1n-harness-6">The runtime that runs the coding agent and loads the skills, tools, hooks and context files from its profile. The agent is untrusted and holds no credentials.</desc><rect class="sfl-box sfl-plate" x="52.5" y="208.5" width="149" height="35" rx="6"/><text class="sfl-t" x="62" y="230.7" font-size="13">Agent harness</text></g>
<g class="sfl-node" data-part="inner" tabindex="0" role="img" aria-label="Inner loop" aria-describedby="sfl1n-inner-7"><desc id="sfl1n-inner-7">Assemble, build and verify, repeated until the work passes. The agent makes its own decisions inside this loop.</desc><rect class="sfl-hit" x="50" y="254" width="98.1" height="20"/><path class="sfl-glyph" d="M63.8 260.8 A4.95 4.95 0 1 1 58.3 259.3" fill="none"/><path class="sfl-glyph sfl-glyph-head" d="M60.9 258.4 L59 261.2 L57.6 257.5 z"/><text class="sfl-l" x="73" y="268" font-size="11">inner loop</text></g>
<g class="sfl-node" data-b="network" data-part="proxy" tabindex="0" role="img" aria-label="Egress proxy" aria-describedby="sfl1n-proxy-8"><desc id="sfl1n-proxy-8">Default-deny. All of the sandbox’s traffic passes through it, in both directions. It blocks what the authorization service hasn’t authorized and attaches credentials, so the agent never holds them.</desc><rect class="sfl-box sfl-b" x="232.5" y="208.5" width="107" height="35" rx="6"/><text class="sfl-t" x="242" y="230.7" font-size="13">Egress proxy</text><g class="sfl-pill" data-b="network" aria-hidden="true"><rect x="242" y="196.8" width="77" height="18.5" rx="9.25"/><text x="250" y="209.8" font-size="10.5">2 NETWORK</text></g></g>
<g class="sfl-node" data-part="record" tabindex="0" role="img" aria-label="Tamper-evident record" aria-describedby="sfl1n-record-11"><desc id="sfl1n-record-11">Harness logs plus identity and proxy records, reviewed by the developer. Every run leaves a record out of any agent’s reach, or fails closed.</desc><rect class="sfl-rec" x="40.5" y="300.5" width="295" height="35" rx="6"/><text class="sfl-t" x="50" y="322.7" font-size="13">Tamper-evident record</text></g>
<g class="sfl-node" data-b="supply" data-part="firewall" tabindex="0" role="img" aria-label="Supply chain firewall" aria-describedby="sfl1n-firewall-13"><desc id="sfl1n-firewall-13">A dedicated admission point that serves only approved, scanned components and blocks compromised or disallowed ones. New versions wait out a cooldown.</desc><rect class="sfl-box sfl-b" x="40.5" y="416.5" width="259" height="35" rx="6"/><text class="sfl-t" x="50" y="438.7" font-size="13">Supply chain firewall</text><g class="sfl-pill" data-b="supply" aria-hidden="true"><rect x="50" y="404.8" width="110.8" height="18.5" rx="9.25"/><text x="58" y="417.8" font-size="10.5">3 SUPPLY CHAIN</text></g></g>
<g class="sfl-node" data-part="gateway" tabindex="0" role="img" aria-label="Model gateway" aria-describedby="sfl1n-gateway-14"><desc id="sfl1n-gateway-14">The enforcement point for inference. It routes model calls to approved models and applies rate limits, token and spend budgets and data-handling rules. It serves the supply chain and network boundaries without being one itself.</desc><rect class="sfl-box" x="40.5" y="468.5" width="259" height="35" rx="6"/><text class="sfl-t" x="50" y="490.7" font-size="13">Model gateway</text></g>
<g class="sfl-node" data-part="downstream" tabindex="0" role="img" aria-label="Downstream" aria-describedby="sfl1n-downstream-15"><desc id="sfl1n-downstream-15">Source control, APIs and MCP servers.</desc><rect class="sfl-box" x="40.5" y="520.5" width="259" height="35" rx="6"/><text class="sfl-t" x="50" y="542.7" font-size="13">Downstream</text></g>
<g class="sfl-node" data-part="pr" tabindex="0" role="img" aria-label="Pull request" aria-describedby="sfl1n-pr-18"><desc id="sfl1n-pr-18">Reviewed by the developer, who drives the next run.</desc><rect class="sfl-box" x="40.5" y="632.5" width="259" height="35" rx="6"/><text class="sfl-t" x="50" y="654.7" font-size="13">Pull request</text></g>
<g class="sfl-node" data-part="loop" tabindex="0" role="img" aria-label="Outer loop" aria-describedby="sfl1n-loop-19"><desc id="sfl1n-loop-19">Review, evals and production feedback flow back to design. At Level 1 the developer drives it: the pull request comes back to them, and they start the next run and update the configuration.</desc><rect class="sfl-plate" x="39.2" y="702.9" width="141.6" height="74.2"/><path class="sfl-glyph sfl-glyph-o" d="M116.2 709.2 A8.0325 8.0325 0 1 1 107.3 706.8" fill="none"/><path class="sfl-glyph sfl-glyph-o sfl-glyph-head" d="M111.4 705.3 L108.4 709.8 L106.2 703.8 z"/><text class="sfl-cap sfl-cap-o" x="110" y="737.4" font-size="10.5" text-anchor="middle">OUTER LOOP</text><text class="sfl-l" x="110" y="752.8" font-size="11" text-anchor="middle">the developer</text><text class="sfl-l" x="110" y="768.2" font-size="11" text-anchor="middle">drives the next run</text></g>
<g class="sfl-key" aria-hidden="true"><rect class="sfl-sw sfl-sw-o" x="40" y="789.5" width="13" height="13" rx="3"/><text class="sfl-l" x="60" y="800" font-size="11">chooses the next step</text><rect class="sfl-sw sfl-sw-w" x="222.831" y="789.5" width="13" height="13" rx="3"/><text class="sfl-l" x="242.8" y="800" font-size="11">agent execution</text></g>
<a class="sfl-link" href="/software-factory.pdf"><text class="sfl-l" x="340" y="822" font-size="11" text-anchor="end">Figure 3 in the paper</text></a>
</svg>
