<svg xmlns="http://www.w3.org/2000/svg" class="sfl-d" viewBox="0 0 356 1270" role="group" aria-label="An orchestrator agent chooses the next step: it takes in requests, context and signals, proposes each task’s profile and scope to the authorization service, which alone grants access, and schedules the tasks on the execution layer, which starts each agent in its own sandbox behind its own proxy. Monitoring agents watch from outside. Changes go through approval and deploy to production, and incidents, findings and evals come back as signals that start new work, which is the outer loop. Pills name the boundaries as the paper numbers them: 1 sandbox, 2 network, 3 supply chain, 4 identity and access.">
<defs><marker id="sfl3n-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="sfl-mk" d="M0 0 L10 5 L0 10 z"/></marker><marker id="sfl3n-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.9" markerHeight="4.9" orient="auto-start-reverse"><path class="sfl-mk sfl-mk-main" d="M0 0 L10 5 L0 10 z"/></marker><marker id="sfl3n-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="sfl-mk sfl-mk-g" d="M0 0 L10 5 L0 10 z"/></marker><marker id="sfl3n-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="sfl-mk sfl-mk-o" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<g data-frame="zone" data-zone="The factory"><rect class="sfl-zone" x="28.5" y="276.5" width="305" height="271" rx="8"/><g class="sfl-node" data-part="zone" tabindex="0" role="img" aria-label="The factory" aria-describedby="sfl3n-zone-9"><desc id="sfl3n-zone-9">Proactive and always on. Each task’s agent runs only for its task, in its own sandbox behind its own proxy, with its own identity and scope.</desc><rect class="sfl-hit" x="32" y="280" width="103.5" height="24.5"/><text class="sfl-cap" x="38" y="293.6" font-size="10.5">THE FACTORY</text></g></g>
<g data-frame="sandbox"><rect class="sfl-sb sfl-ghost" x="52.5" y="324.5" width="173" height="95" rx="6"/><rect class="sfl-sb sfl-ghost" x="46.5" y="318.5" width="173" height="95" rx="6"/><rect class="sfl-sb" x="40.5" y="312.5" width="173" height="95" rx="8"/><g class="sfl-node" data-part="sandbox" tabindex="0" role="img" aria-label="Sandbox" aria-describedby="sfl3n-sandbox-10"><desc id="sfl3n-sandbox-10">Each agent in a run gets its own sandbox, configured from the profile for its kind of agent. Monitoring that watches from outside can tighten or stop it mid-run.</desc><g class="sfl-pill" data-b="sandbox" aria-hidden="true"><rect x="127" y="300.8" width="77" height="18.5" rx="9.25"/><text x="135" y="313.8" font-size="10.5">1 SANDBOX</text></g></g></g>
<g data-frame="behind" data-zone="Behind the proxy"><rect class="sfl-zone" x="28.5" y="580.5" width="305" height="187" rx="8"/><g class="sfl-node" data-part="behind" tabindex="0" role="img" aria-label="Behind the proxy" aria-describedby="sfl3n-behind-18"><desc id="sfl3n-behind-18">What the agent reaches, and only through the proxy, with only the operations the service authorized.</desc><rect class="sfl-hit" x="32" y="584" width="142.3" height="24.5"/><text class="sfl-cap" x="38" y="597.6" font-size="10.5">BEHIND THE PROXY</text></g></g>
<g data-frame="output" data-zone="Output"><rect class="sfl-zone" x="28.5" y="800.5" width="305" height="319" rx="8"/><g class="sfl-node" data-part="output" tabindex="0" role="img" aria-label="Output" aria-describedby="sfl3n-output-22"><desc id="sfl3n-output-22">What leaves the factory, and the review and approval it passes on the way.</desc><rect class="sfl-hit" x="32" y="804" width="64.6" height="24.5"/><text class="sfl-cap" x="38" y="817.6" font-size="10.5">OUTPUT</text></g></g>
<path class="sfl-wire" d="M113 44 L113 68" marker-end="url(#sfl3n-a)"/>
<path class="sfl-wire" d="M267 44 L267 68" marker-end="url(#sfl3n-a)"/>
<path class="sfl-wire sfl-main" d="M202 354 L232 354" marker-end="url(#sfl3n-m)"/>
<path class="sfl-wire" d="M340 354 H348 V738"/>
<path class="sfl-wire" d="M348 634 L300 634" marker-end="url(#sfl3n-a)"/>
<path class="sfl-wire" d="M348 686 L300 686" marker-end="url(#sfl3n-a)"/>
<path class="sfl-wire" d="M348 738 L300 738" marker-end="url(#sfl3n-a)"/>
<path class="sfl-wire" d="M170 868 L170 892" marker-end="url(#sfl3n-a)"/>
<path class="sfl-wire" d="M170 928 L170 952" marker-end="url(#sfl3n-a)"/>
<path class="sfl-wire" d="M170 988 L170 1012" marker-end="url(#sfl3n-a)"/>
<path class="sfl-wire" d="M170 1048 L170 1072" marker-end="url(#sfl3n-a)"/>
<path class="sfl-wire sfl-loop" d="M170 1108 L170 1136 L14 1136 L14 86 L40 86" marker-end="url(#sfl3n-o)"/>
<g class="sfl-node sfl-edge" data-part="schedules" tabindex="0" role="img" aria-label="schedules tasks" aria-describedby="sfl3n-schedules-5"><desc id="sfl3n-schedules-5">The orchestrator schedules each task on the execution layer, a separate system. It never starts agents itself.</desc><path class="sfl-hit" d="M56 104 L56 136"/><path class="sfl-wire" d="M56 104 L56 136" marker-end="url(#sfl3n-a)"/><rect class="sfl-plate" x="45.4" y="111.5" width="109.2" height="17"/><text class="sfl-l" x="100" y="124" font-size="11" text-anchor="middle">schedules tasks</text></g>
<g class="sfl-node sfl-edge" data-part="proposes" tabindex="0" role="img" aria-label="proposes profile and scope" aria-describedby="sfl3n-proposes-7"><desc id="sfl3n-proposes-7">In preflight the orchestrator proposes a profile and task scope for each piece of work. It proposes; the service alone decides.</desc><path class="sfl-hit" d="M340 94 L348 94 L348 222 L340 222"/><path class="sfl-wire" d="M340 94 L348 94 L348 222 L340 222" marker-end="url(#sfl3n-a)"/><text class="sfl-l" x="342" y="124" font-size="11" text-anchor="end">proposes profile and scope</text></g>
<g class="sfl-node sfl-edge" data-part="starts" tabindex="0" role="img" aria-label="starts the agent" aria-describedby="sfl3n-starts-8"><desc id="sfl3n-starts-8">The execution layer starts the agent in a fresh sandbox with its profile and only its authorized scope, and won’t start it if a required enforcement point is down.</desc><path class="sfl-hit" d="M56 172 L56 312"/><path class="sfl-wire" d="M56 172 L56 312" marker-end="url(#sfl3n-a)"/><rect class="sfl-plate" x="46.1" y="179.5" width="115.8" height="17"/><text class="sfl-l" x="104" y="192" font-size="11" text-anchor="middle">starts the agent</text></g>
<g class="sfl-node sfl-edge" data-part="authorized" tabindex="0" role="img" aria-label="authorized scope" aria-describedby="sfl3n-authorized-14"><desc id="sfl3n-authorized-14">The service’s decision, which the proxy enforces: it blocks what the service hasn’t authorized. Only a new decision can widen a task.</desc><path class="sfl-hit" d="M326 240 L326 336"/><path class="sfl-wire sfl-grant" d="M326 240 L326 336" marker-end="url(#sfl3n-g)"/><text class="sfl-l" x="320" y="262" font-size="11" text-anchor="end">authorized scope</text></g>
<g class="sfl-node sfl-edge" data-part="watches" tabindex="0" role="img" aria-label="watches" aria-describedby="sfl3n-watches-16"><desc id="sfl3n-watches-16">From outside the sandbox, for thrash and drift.</desc><path class="sfl-hit" d="M80 444 L80 408"/><path class="sfl-wire" d="M80 444 L80 408" marker-end="url(#sfl3n-a)"/><rect class="sfl-plate" x="51.9" y="417.5" width="56.3" height="17"/><text class="sfl-l" x="80" y="430" font-size="11" text-anchor="middle">watches</text></g>
<g class="sfl-node sfl-edge" data-part="opens" tabindex="0" role="img" aria-label="opens" aria-describedby="sfl3n-opens-23"><desc id="sfl3n-opens-23">The agent opens its pull request in source control, through the proxy.</desc><path class="sfl-hit" d="M170 756 L170 832"/><path class="sfl-wire" d="M170 756 L170 832" marker-end="url(#sfl3n-a)"/><rect class="sfl-plate" x="148.5" y="785.5" width="43.1" height="17"/><text class="sfl-l" x="170" y="798" font-size="11" text-anchor="middle">opens</text></g>
<g class="sfl-node" data-part="input" tabindex="0" role="img" aria-label="Requests" aria-describedby="sfl3n-input-1"><desc id="sfl3n-input-1">Work people file, and tickets.</desc><rect class="sfl-box" x="40.5" y="8.5" width="145" height="35" rx="6"/><text class="sfl-t" x="50" y="30.7" font-size="13">Requests</text></g>
<g class="sfl-node" data-part="context" tabindex="0" role="img" aria-label="Context" aria-describedby="sfl3n-context-2"><desc id="sfl3n-context-2">What the orchestrator gathers in preflight: tickets, code and conversations.</desc><rect class="sfl-box" x="194.5" y="8.5" width="145" height="35" rx="6"/><text class="sfl-t" x="204" y="30.7" font-size="13">Context</text></g>
<g class="sfl-node" data-part="orch" tabindex="0" role="img" aria-label="Orchestrator agent" aria-describedby="sfl3n-orch-3"><desc id="sfl3n-orch-3">An agent chooses the next step. It takes work from requests and signals, runs preflight to propose a profile and scope for each task, and divides the work across agents. Nothing it decides authorizes itself.</desc><rect class="sfl-box sfl-agent sfl-o" x="40.5" y="68.5" width="299" height="35" rx="6"/><text class="sfl-t" x="50" y="90.7" font-size="13">Orchestrator agent</text></g>
<g class="sfl-node" data-part="exec" tabindex="0" role="img" aria-label="Durable execution layer" aria-describedby="sfl3n-exec-4"><desc id="sfl3n-exec-4">The same durable system as at Level 2, starting each task’s agent only with its authorized scope. Only the execution layer starts agents; the orchestrator never does.</desc><rect class="sfl-box" x="40.5" y="136.5" width="299" height="35" rx="6"/><text class="sfl-t" x="50" y="158.7" font-size="13">Durable execution layer</text></g>
<g class="sfl-node" data-b="identity" data-part="auth" tabindex="0" role="img" aria-label="Runtime authorization service" aria-describedby="sfl3n-auth-6"><desc id="sfl3n-auth-6">Decides what access each task gets, within the agent’s profile, any delegation and the organization’s policy. It records every grant and can revoke it. Part of the identity and access boundary.</desc><rect class="sfl-box sfl-b" x="92.5" y="204.5" width="247" height="35" rx="6"/><text class="sfl-t" x="102" y="226.7" font-size="13">Runtime authorization service</text><g class="sfl-pill" data-b="identity" aria-hidden="true"><rect x="102" y="192.8" width="158.2" height="18.5" rx="9.25"/><text x="110" y="205.8" font-size="10.5">4 IDENTITY AND ACCESS</text></g></g>
<g class="sfl-node" data-part="harness" tabindex="0" role="img" aria-label="Coding agent" aria-describedby="sfl3n-harness-11"><desc id="sfl3n-harness-11">The agent doing one task, with its own identity, profile and task scope. Only a new decision by the authorization service can widen its task.</desc><rect class="sfl-box sfl-plate" x="52.5" y="336.5" width="149" height="35" rx="6"/><text class="sfl-t" x="62" y="358.7" font-size="13">Coding agent</text></g>
<g class="sfl-node" data-part="inner" tabindex="0" role="img" aria-label="Inner loop" aria-describedby="sfl3n-inner-12"><desc id="sfl3n-inner-12">Assemble, build and verify, repeated until the work passes. The agent makes its own decisions inside this loop.</desc><rect class="sfl-hit" x="50" y="382" width="98.1" height="20"/><path class="sfl-glyph" d="M63.8 388.8 A4.95 4.95 0 1 1 58.3 387.3" fill="none"/><path class="sfl-glyph sfl-glyph-head" d="M60.9 386.4 L59 389.2 L57.6 385.5 z"/><text class="sfl-l" x="73" y="396" font-size="11">inner loop</text></g>
<g class="sfl-node" data-b="network" data-part="proxy" tabindex="0" role="img" aria-label="Egress proxy" aria-describedby="sfl3n-proxy-13"><desc id="sfl3n-proxy-13">Default-deny, one per task, with its own egress rules and task scope. Traffic between agents passes through the same enforcement as any other traffic.</desc><rect class="sfl-box sfl-b sfl-ghost" x="244.5" y="348.5" width="107" height="35" rx="6"/><rect class="sfl-box sfl-b sfl-ghost" x="238.5" y="342.5" width="107" height="35" rx="6"/><rect class="sfl-box sfl-b" x="232.5" y="336.5" width="107" height="35" rx="6"/><text class="sfl-t" x="242" y="358.7" font-size="13">Egress proxy</text><g class="sfl-pill" data-b="network" aria-hidden="true"><rect x="242" y="324.8" width="77" height="18.5" rx="9.25"/><text x="250" y="337.8" font-size="10.5">2 NETWORK</text></g></g>
<g class="sfl-node" data-part="monitor" tabindex="0" role="img" aria-label="Monitoring agent" aria-describedby="sfl3n-monitor-15"><desc id="sfl3n-monitor-15">Watches signals and work in progress, from outside the agents it watches, for thrash and drift. Like the orchestrator, it can flag and request but never grant or approve.</desc><rect class="sfl-box sfl-agent" x="40.5" y="444.5" width="173" height="35" rx="6"/><text class="sfl-t" x="50" y="466.7" font-size="13">Monitoring agent</text></g>
<g class="sfl-node" data-part="record" tabindex="0" role="img" aria-label="Tamper-evident record" aria-describedby="sfl3n-record-17"><desc id="sfl3n-record-17">Telemetry and evals across runs, and monitoring of running agents, out of any agent’s reach. Agents that drift or become ineffective are stopped.</desc><rect class="sfl-rec" x="40.5" y="500.5" width="295" height="35" rx="6"/><text class="sfl-t" x="50" y="522.7" font-size="13">Tamper-evident record</text></g>
<g class="sfl-node" data-b="supply" data-part="firewall" tabindex="0" role="img" aria-label="Supply chain firewall" aria-describedby="sfl3n-firewall-19"><desc id="sfl3n-firewall-19">A dedicated admission point that serves only approved, scanned components and blocks compromised or disallowed ones. New versions wait out a cooldown.</desc><rect class="sfl-box sfl-b" x="40.5" y="616.5" width="259" height="35" rx="6"/><text class="sfl-t" x="50" y="638.7" font-size="13">Supply chain firewall</text><g class="sfl-pill" data-b="supply" aria-hidden="true"><rect x="50" y="604.8" width="110.8" height="18.5" rx="9.25"/><text x="58" y="617.8" font-size="10.5">3 SUPPLY CHAIN</text></g></g>
<g class="sfl-node" data-part="gateway" tabindex="0" role="img" aria-label="Model gateway" aria-describedby="sfl3n-gateway-20"><desc id="sfl3n-gateway-20">The enforcement point for inference. It routes model calls to approved models and applies rate limits, token and spend budgets and data-handling rules. It serves the supply chain and network boundaries without being one itself.</desc><rect class="sfl-box" x="40.5" y="668.5" width="259" height="35" rx="6"/><text class="sfl-t" x="50" y="690.7" font-size="13">Model gateway</text></g>
<g class="sfl-node" data-part="downstream" tabindex="0" role="img" aria-label="Downstream" aria-describedby="sfl3n-downstream-21"><desc id="sfl3n-downstream-21">Source control, APIs and MCP servers.</desc><rect class="sfl-box" x="40.5" y="720.5" width="259" height="35" rx="6"/><text class="sfl-t" x="50" y="742.7" font-size="13">Downstream</text></g>
<g class="sfl-node" data-part="pr" tabindex="0" role="img" aria-label="Pull request" aria-describedby="sfl3n-pr-24"><desc id="sfl3n-pr-24">Reviewed until ready, then approved like any other change.</desc><rect class="sfl-box" x="40.5" y="832.5" width="259" height="35" rx="6"/><text class="sfl-t" x="50" y="854.7" font-size="13">Pull request</text></g>
<g class="sfl-node" data-part="approval" tabindex="0" role="img" aria-label="Approval" aria-describedby="sfl3n-approval-25"><desc id="sfl3n-approval-25">Automatic or by a person, under the organization’s approval policy: by the change’s kind, risk, blast radius and reversibility, and the verification it has passed. Automatic approval is an option, never a requirement.</desc><rect class="sfl-box" x="40.5" y="892.5" width="259" height="35" rx="6"/><text class="sfl-t" x="50" y="914.7" font-size="13">Approval</text></g>
<g class="sfl-node" data-part="deploy" tabindex="0" role="img" aria-label="Deploy" aria-describedby="sfl3n-deploy-26"><desc id="sfl3n-deploy-26">Merged changes deploy under the same approval rules as any high-impact action, and can be rolled back.</desc><rect class="sfl-box" x="40.5" y="952.5" width="259" height="35" rx="6"/><text class="sfl-t" x="50" y="974.7" font-size="13">Deploy</text></g>
<g class="sfl-node" data-part="production" tabindex="0" role="img" aria-label="Production" aria-describedby="sfl3n-production-27"><desc id="sfl3n-production-27">Emits incidents and metrics, which come back as signals that start new work.</desc><rect class="sfl-box" x="40.5" y="1012.5" width="259" height="35" rx="6"/><text class="sfl-t" x="50" y="1034.7" font-size="13">Production</text></g>
<g class="sfl-node" data-part="signals" tabindex="0" role="img" aria-label="Signals" aria-describedby="sfl3n-signals-28"><desc id="sfl3n-signals-28">Events that start work without a person filing it: production incidents, scanner findings, eval results, tickets agents create. Signals are untrusted inputs.</desc><rect class="sfl-box" x="40.5" y="1072.5" width="259" height="35" rx="6"/><text class="sfl-t" x="50" y="1094.7" font-size="13">Signals</text></g>
<g class="sfl-node" data-part="loop" tabindex="0" role="img" aria-label="Outer loop" aria-describedby="sfl3n-loop-29"><desc id="sfl3n-loop-29">Review, evals and production feedback flow back to design. At Level 3 signals drive it too: incidents, findings and evals come back as work, and the orchestrator can propose changes to the factory that it can’t approve.</desc><rect class="sfl-plate" x="59" y="1142.9" width="101.9" height="74.2"/><path class="sfl-glyph sfl-glyph-o" d="M116.2 1149.2 A8.0325 8.0325 0 1 1 107.3 1146.8" fill="none"/><path class="sfl-glyph sfl-glyph-o sfl-glyph-head" d="M111.4 1145.3 L108.4 1149.8 L106.2 1143.8 z"/><text class="sfl-cap sfl-cap-o" x="110" y="1177.4" font-size="10.5" text-anchor="middle">OUTER LOOP</text><text class="sfl-l" x="110" y="1192.8" font-size="11" text-anchor="middle">signals start</text><text class="sfl-l" x="110" y="1208.2" font-size="11" text-anchor="middle">new work</text></g>
<g class="sfl-key" aria-hidden="true"><rect class="sfl-sw sfl-sw-o" x="40" y="1229.5" width="13" height="13" rx="3"/><text class="sfl-l" x="60" y="1240" font-size="11">chooses the next step</text><rect class="sfl-sw sfl-sw-w" x="222.831" y="1229.5" width="13" height="13" rx="3"/><text class="sfl-l" x="242.8" y="1240" font-size="11">agent execution</text></g>
<a class="sfl-link" href="/software-factory.pdf"><text class="sfl-l" x="340" y="1262" font-size="11" text-anchor="end">Figure 5 in the paper</text></a>
</svg>
