baseURL = "https://agentbaseline.org/"
title = "Agent Baseline"
locale = "en"

# This site is two pages and a PDF. It has no taxonomies, no sections and no
# feed, so the kinds that would invent them are switched off.
#
# Placement is load-bearing, not style. TOML has no closing delimiter: every
# key after a [table] header belongs to that table until the next header. This
# line used to sit below the [[module.mounts]] block, which made it a key of
# the last mount rather than a root setting — Hugo dropped it silently and
# published all six kinds anyway. That is how /categories and /tags came to
# serve empty RSS channels to browsers as `application/xml`. Root keys go
# above the first table header.
#
# `sitemap` is deliberately absent: the site ships its own template at
# layouts/sitemap.xml, and disabling the kind would suppress it.
disableKinds = ["taxonomy", "term", "RSS", "404", "section"]

# The site renders FROM the catalogue: whitepaper/controls.yaml is mounted
# into Hugo's data tree, so the outcomes and their identifier ranges on the
# page are generated from it and cannot drift.
[[module.mounts]]
  source = "whitepaper/controls.yaml"
  target = "data/controls.yaml"
[[module.mounts]]
  source = "whitepaper/contributors.yaml"
  target = "data/contributors.yaml"
[[module.mounts]]
  source = "layouts"
  target = "layouts"
[[module.mounts]]
  source = "content"
  target = "content"

[params]
  version       = "1.0-draft"
  published     = "30 July 2026"
  commentsUntil = "30 September 2026"
  repo          = "https://github.com/agentbaseline/agentbaseline"

# The event strip renders only while `until` is in the future, so it removes
# itself the day after rather than relying on anyone noticing.
[params.event]
  id    = "blackhat-2026"
  label = "Live · Black Hat"
  say   = "Docker, Keycard and Snyk are there 3–7 August. Bring the baseline a hard question."
  cta   = "RSVP"
  url   = "https://luma.com/insecure-wbn3"
  until = "2026-08-08"
  # The closing block renders from the same table, so the strip and the block
  # expire together and can never disagree about the event.
  pull  = "Filing an issue is the durable way to disagree with this. Being in the room is the faster one."
  when  = "Black Hat week · 3–7 August 2026"
  where = "Marquee, Las Vegas"
  what  = "Securing Your Coding Agent: The Road to the Software Factory"
  who   = "A panel with Docker, Keycard and Snyk"
