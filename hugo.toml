baseURL = "https://agentbaseline.org/"
title = "Agent Baseline"
locale = "en"

# This site is two pages and a PDF. It has no taxonomies, no sections and no
# feed, so the kinds that would invent them are switched off.
#
# Placement is load-bearing, not style. TOML has no closing delimiter: every
# key after a [table] header belongs to that table until the next header. This
# line used to sit below the [[module.mounts]] block, which made it a key of
# the last mount rather than a root setting — Hugo dropped it silently and
# published all six kinds anyway. That is how /categories and /tags came to
# serve empty RSS channels to browsers as `application/xml`. Root keys go
# above the first table header.
#
# `sitemap` and `404` are deliberately absent: the site ships its own templates
# for both (layouts/sitemap.xml, layouts/404.html), and disabling either kind
# would suppress the file Hugo needs to write.
disableKinds = ["taxonomy", "term", "RSS", "section"]

# The site renders FROM the catalogue: whitepaper/controls.yaml is mounted
# into Hugo's data tree, so the outcomes and their identifier ranges on the
# page are generated from it and cannot drift.
[[module.mounts]]
  source = "whitepaper/controls.yaml"
  target = "data/controls.yaml"
[[module.mounts]]
  source = "whitepaper/contributors.yaml"
  target = "data/contributors.yaml"
[[module.mounts]]
  source = "software-factory/boundaries.yaml"
  target = "data/sfboundaries.yaml"
[[module.mounts]]
  source = "software-factory/levels.yaml"
  target = "data/sflevels.yaml"
[[module.mounts]]
  source = "software-factory/contributors.yaml"
  target = "data/sfcontributors.yaml"
[[module.mounts]]
  source = "layouts"
  target = "layouts"
[[module.mounts]]
  source = "content"
  target = "content"
# Declaring any static mount replaces Hugo's default one, so the site's own
# static/ is named here first or every font, script and icon would vanish.
[[module.mounts]]
  source = "static"
  target = "static"
# The catalogue itself, served at /controls.yaml: the file the pages, the PDF's
# Appendix A and controls.md are rendered from, and the one an agent should read
# rather than parse a rendering of. Mounted, not copied — a copy in static/
# would be a second source of truth. vercel.json serves it as
# `text/yaml; charset=utf-8` rather than application/yaml, the type RFC 9512
# registers, because browsers download an application/yaml response instead of
# showing it, and this file is meant to be read where it opens; YAML tools take
# either. The JSON-LD still names its format as application/yaml.
[[module.mounts]]
  source = "whitepaper/controls.yaml"
  target = "static/controls.yaml"
# The paper's figures, served at /figures/ so its text version can point at
# them. Filtered to the SVGs: the generator, its helper module and its box
# manifest live in the same directory and are not for publishing.
[[module.mounts]]
  source = "whitepaper/figures"
  target = "static/figures"
  files = ["*.svg"]
# The reference architecture's figures, the same way, at /software-factory/figures/.
[[module.mounts]]
  source = "software-factory/figures"
  target = "static/software-factory/figures"
  files = ["*.svg"]
# The text versions read their documents from here — see params.texts. Mounted
# at the same path they have in the repository, so a relative link inside one
# resolves against the directory it was written in. Declaring any assets mount
# replaces Hugo's default one, as with static above; this site has no assets/
# directory, so if one is ever added, mount it here first.
[[module.mounts]]
  source = "whitepaper/whitepaper.md"
  target = "assets/whitepaper/whitepaper.md"
[[module.mounts]]
  source = "whitepaper/CONTROLS.md"
  target = "assets/whitepaper/CONTROLS.md"
[[module.mounts]]
  source = "software-factory/software-factory.md"
  target = "assets/software-factory/software-factory.md"

# One output format per text version, all on the home page, so each lands at
# the root of the site under its baseName: /whitepaper.md, /controls.md,
# /software-factory.md. One template, layouts/index.md, renders every
# text/markdown format; it finds its entry in params.texts by permalink, which
# works because `permalinkable` makes .RelPermalink name the file being written
# rather than the HTML page.
# `notAlternative` keeps them out of .AlternativeOutputFormats: the <link
# rel="alternate"> tags are written by hand, per page, in
# partials/machine-readable.html, because /controls.md is the text of
# /controls, not of the home page that happens to write it.
[outputFormats.paper]
  mediaType = "text/markdown"
  baseName = "whitepaper"
  isPlainText = true
  notAlternative = true
  permalinkable = true
[outputFormats.catalogue]
  mediaType = "text/markdown"
  baseName = "controls"
  isPlainText = true
  notAlternative = true
  permalinkable = true
[outputFormats.reference]
  mediaType = "text/markdown"
  baseName = "software-factory"
  isPlainText = true
  notAlternative = true
  permalinkable = true
# /llms.txt and /llms-full.txt, after llmstxt.org. Each has its own template,
# layouts/index.llms.txt and layouts/index.llmsfull.txt.
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true
  permalinkable = true
[outputFormats.llmsfull]
  mediaType = "text/plain"
  baseName = "llms-full"
  isPlainText = true
  notAlternative = true
  permalinkable = true

[outputs]
  home = ["html", "paper", "catalogue", "reference", "llms", "llmsfull"]

[params]
  version       = "1.0-draft"
  published     = "30 July 2026"
  commentsUntil = "30 September 2026"
  repo          = "https://github.com/agentbaseline/agentbaseline"

  # The community Slack, linked from the utility bar and the review section.
  # A shared invite link. Slack's default is a link that lives 30 days and
  # 400 uses; the expiry is chosen when the link is copied (Invite people →
  # Copy invite link → Edit link settings), and an owner or admin renews a
  # lapsed one under Workspace settings → People → Invitations → Invite links.
  # The site would go on pointing at a dead link, so this is the one line to
  # change. Check it in a browser: join.slack.com answers curl with 302 then
  # 403 whether or not the link is live. Leave it empty and the links go.
  # A root key of [params], so it stays above the first sub-table.
  slack         = "https://join.slack.com/t/agentbaseline/shared_invite/zt-4af54ql1d-flDoRP_Bk~l1XxcU4sWJRg"

  # Every brand download is served under this prefix, so a file that has left
  # the site still says whose mark it is. The prefix is in the served name, not
  # only in the <a download> attribute, because Vercel sends every static file
  # with Content-Disposition: inline; filename="<served name>", and for a
  # same-origin download that filename takes precedence over the attribute
  # (HTML, "downloading resources", step 6): Chrome saved icon.svg, not
  # agent-baseline-icon.svg. A root key of [params], so it has to stay above
  # the first sub-table — see the note at the top of this file.
  brandPrefix = "agent-baseline"

# The downloadable brand assets, in the order both menus list them. Two surfaces
# offer these — the Artifacts dropdown and the wordmark's own right-click menu —
# and both read this one list through partials/brand-rows.html, so an asset is
# added here and nowhere else.
#
#   path  what the site serves, and therefore what a download saves as. The
#         row's label is the path with brandPrefix trimmed. The favicon stays
#         at icon.svg and icon-512.png for the nine <link> tags that name it;
#         bin/build-brand writes the branded copies beside them from the same
#         bytes, so nothing is kept by hand twice.
#   icon  a partial under layouts/partials/icons.
#
# Each file is for one ground: the plain wordmark is dark ink for light grounds,
# the -on-dark files carry the dark theme's ink for dark grounds, and the
# animated wordmark exists only for dark grounds. The name says which.
#
# Each path is checked with fileExists at build time, so an asset that has not
# been generated yet costs a missing row rather than a 404.
[[params.brandAssets]]
  path = "agent-baseline-wordmark.svg"
  icon = "file-svg"
[[params.brandAssets]]
  path = "agent-baseline-wordmark.png"
  icon = "file-png"
[[params.brandAssets]]
  path = "agent-baseline-wordmark-on-dark.svg"
  icon = "file-svg"
[[params.brandAssets]]
  path = "agent-baseline-wordmark-on-dark.png"
  icon = "file-png"
[[params.brandAssets]]
  path = "agent-baseline-icon.svg"
  icon = "file-svg"
[[params.brandAssets]]
  path = "agent-baseline-icon.png"
  icon = "file-png"
[[params.brandAssets]]
  path = "agent-baseline-wordmark-animated-on-dark.mov"
  icon = "file-video"

# The reference architecture: the second paper, built on the baseline, with
# the software factory as its subject. The homepage section, its own page, the
# Artifacts rows, the bar's link and the controls page all read this table.
# `pdf` and `paper` are checked with fileExists, so a checkout without the
# file gets no dead link; `source` is the repo subfolder; `template` is the
# issue form that applies the `software-factory` label, which an outside
# commenter cannot set from a URL. `commentsUntil` is empty until the working
# group names a date — the copy then says "open for comment" and no more.
# The PDF is published and required (bin/papers.py): a missing PDF or manifest
# fails bin/check-sf-pdf, and so does one that isn't the build of this source.
[params.softwareFactory]
  # The homepage's one line about the second paper, in its section after the
  # baseline's own paper. The paper's page writes its own opening. Keep it
  # shorter than the white paper's line above it (19 words) and on one line
  # at the 680px measure, so the section stays smaller than the baseline's.
  summary       = "The Secure Software Factory applies Agent Baseline to agents that ship code."
  # The paper's own front matter (software-factory.md, line 3: "Version 1,
  # October 13, 2026"). The page's title block states them; check-copy holds
  # them to the paper.
  version       = "1"
  published     = "13 October 2026"
  pdf           = "software-factory.pdf"
  source        = "software-factory"
  # The paper's markdown inside `source`; checked with fileExists like `pdf`.
  paper         = "software-factory.md"
  template      = "software-factory.yml"
  commentsUntil = ""
  # The bar button's launch plate (accent-filled, marked New), and the New on
  # the homepage's launch line, render only before this moment, two weeks
  # after the 13 October launch; the button, outlined, and the line stay
  # (layouts/partials/sf-new.html). Compared at build time, like
  # [params.event].until, and with the New York offset for the same reason (a
  # bare date is midnight UTC, 8 pm the evening before in New York). The site
  # does not rebuild on its own: redeploy on or after 27 October or the plate
  # stays up.
  launchUntil   = "2026-10-27T00:00:00-04:00"
  # The levels band: the paper's level names, figures and captions, with one
  # sentence per level written for the page (software-factory/levels.yaml).
  # Set false and the band leaves in one line.
  showLevels    = true

# Thanked on the homepage under the bylines, sorted by name there. Each mark is
# the organization's published one (its press kit, or a logo library built from
# media kits), recoloured to currentColor, never redrawn; `name` is what a
# screen reader hears, and `height` (px) is set by eye so none outweighs the rest.
[params.thanks]
  orgs = [
    { name = "Browserbase", logo = "browserbase", height = 19 },
    { name = "Docker",      logo = "docker",      height = 17 },
    { name = "Keycard",     logo = "keycard",     height = 17.5 },
    { name = "Snyk",        logo = "snyk",        height = 24 },
    { name = "Socket",      logo = "socket",      height = 19 },
    { name = "Tessl",       logo = "tessl",       height = 22 },
  ]

# The text versions. Every document the site hands a person as a page or a PDF
# is also published as Markdown, for agents and for anyone who would rather read
# the source than a rendering of it. Nothing on any page changes; the pages say
# where their text is in a <link rel="alternate">, and an agent that asks for
# text/markdown is sent there (vercel.json).
#
#   format       the output format above that writes the file. Its baseName is
#                the file's name at the root of the site.
#   source       the document, by its path in the repository. A mount above
#                puts it under assets/ at the same path. The body is the source
#                byte for byte — the file the PDF is built from — with relative
#                links made absolute, so it cannot drift from the paper.
#   title        how the file's header and llms.txt name it.
#   page         the HTML page it is the text of: its canonical, and the page
#                whose <head> links to it. vercel.json carries the same pairing
#                as a Link header, and bin/check-seo fails if the two disagree.
#   schema       the schema.org type of the page's JSON-LD for this document.
#   facts        optional: the [params] table holding this document's own
#                `version` and `published`, for a document versioned apart from
#                the baseline. Without it, the baseline's params.version and
#                params.published. The text's header, llms-full.txt and the
#                JSON-LD all read them through partials/text-facts.html.
#   contributors optional, for a TechArticle: the data file (mounted above)
#                whose confirmed entries are its authors. Without it, the
#                baseline's, `contributors`.
#   figures      optional: where this site serves the SVGs in the document's
#                own figures/ directory (a static mount above). The text's links
#                to them point there rather than at the repository.
#   pdf          optional: the typeset edition, a path under static/.
#   data         optional: the machine-readable source, by the path this site
#                serves it at (a static mount above puts it there).
#   license      an SPDX identifier, and license_url the licence itself. Which
#                licence applies is README's call, not this file's: prose and
#                figures are CC BY 4.0; controls.yaml is Apache-2.0, and
#                CONTROLS.md is generated from it, so it carries the same. README
#                marks both as pending legal confirmation — change them there
#                first, then here.
#   description  one sentence, for llms.txt and the JSON-LD.
#
# A new document joins the way the reference architecture did, with no new
# template: mount it under assets/ at its repository path, add an output format
# with the file's baseName, add that format to outputs.home, and add an entry
# here. Set `page` to the HTML page that presents it, and put
# partials/machine-readable.html in that page's <head>; or set it to the text's
# own address if there is no page — then no page links to it and no Link header
# or redirect is needed. Add the vercel.json redirect and headers for the new
# file, and llms.txt and llms-full.txt pick it up on the next build.
[[params.texts]]
  format      = "paper"
  source      = "whitepaper/whitepaper.md"
  title       = "Agent Baseline white paper"
  page        = "/"
  schema      = "TechArticle"
  figures     = "/figures/"
  pdf         = "whitepaper.pdf"
  license     = "CC-BY-4.0"
  license_url = "https://creativecommons.org/licenses/by/4.0/"
  description = "The argument in full: why product categories do not map to the problem of running AI agents safely, the six security outcomes that do, and the controls that evidence each."
[[params.texts]]
  format      = "catalogue"
  source      = "whitepaper/CONTROLS.md"
  title       = "Agent Baseline controls"
  page        = "/controls"
  schema      = "Dataset"
  data        = "controls.yaml"
  license     = "Apache-2.0"
  license_url = "https://www.apache.org/licenses/LICENSE-2.0"
  description = "Every control, grouped by outcome, each with a permanent identifier you can cite and the requirement it states. Generated from controls.yaml, the source of truth."
[[params.texts]]
  format       = "reference"
  source       = "software-factory/software-factory.md"
  title        = "The Secure Software Factory: A Reference Architecture"
  page         = "/reference-architecture"
  schema       = "TechArticle"
  facts        = "softwareFactory"
  contributors = "sfcontributors"
  figures      = "/software-factory/figures/"
  pdf          = "software-factory.pdf"
  license      = "CC-BY-4.0"
  license_url  = "https://creativecommons.org/licenses/by/4.0/"
  description  = "Four security boundaries for software factories, where AI agents turn tickets into tested code, enforced outside the agent at every level of autonomy. Built on Agent Baseline."

# The event strip and the closing block render only while `until` is in the
# future AT BUILD TIME. The site is static, so after `until` passes they stay
# up until the next production deploy. On 14 October 2026: push anything, or
# redeploy from the Vercel dashboard, and they are gone.
[params.event]
  id    = "sf-show-and-tell-2026"
  label = "Live · New York"
  say   = "Secure Software Factory Show and Tell, 13 October at Elsie Rooftop. Bring the factory a hard question."
  cta   = "RSVP"
  url   = "https://luma.com/keycard-rg1c"
  # RFC 3339 with the New York offset. A bare date is parsed as midnight UTC,
  # which is 8pm on launch night in New York: a deploy that evening would have
  # pulled the strip and the closing block while the room was still full. The
  # site sets no timeZone (a root key, and it would change how every date on
  # the site is read), so the offset lives on the value. Still EDT on
  # 14 October; US clocks change on 1 November.
  until = "2026-10-14T06:00:00-04:00"
  # The closing block renders from the same table, so the strip and the block
  # expire together and can never disagree about the event.
  pull  = "Filing an issue is the durable way to disagree with a paper. Being in the room is the faster one."
  when  = "Tuesday 13 October 2026 · from 5:30 pm · launch night"
  where = "Elsie Rooftop, 1412 Broadway, New York"
  what  = "Secure Software Factory Show and Tell"
  who   = "A panel moderated by Allie Howe, with Dick Hardt, co-author of OAuth 2.0, and speakers from Keycard, Socket, Docker and Braintrust, then live demos"
