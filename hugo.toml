baseURL = "https://agentbaseline.org/"
title = "Agent Baseline"
locale = "en"

# This site is two pages and a PDF. It has no taxonomies, no sections and no
# feed, so the kinds that would invent them are switched off.
#
# Placement is load-bearing, not style. TOML has no closing delimiter: every
# key after a [table] header belongs to that table until the next header. This
# line used to sit below the [[module.mounts]] block, which made it a key of
# the last mount rather than a root setting — Hugo dropped it silently and
# published all six kinds anyway. That is how /categories and /tags came to
# serve empty RSS channels to browsers as `application/xml`. Root keys go
# above the first table header.
#
# `sitemap` and `404` are deliberately absent: the site ships its own templates
# for both (layouts/sitemap.xml, layouts/404.html), and disabling either kind
# would suppress the file Hugo needs to write.
disableKinds = ["taxonomy", "term", "RSS", "section"]

# The site renders FROM the catalogue: whitepaper/controls.yaml is mounted
# into Hugo's data tree, so the outcomes and their identifier ranges on the
# page are generated from it and cannot drift.
[[module.mounts]]
  source = "whitepaper/controls.yaml"
  target = "data/controls.yaml"
# The same two files again, this time as published artifacts.
#
# The site's own robots.txt says this document "exists to be read, quoted and
# cited — by people, by search engines and by models". Until now the only thing
# a machine could fetch was whitepaper.pdf and two HTML pages: the catalogue
# that everything renders FROM was mounted into the data tree and never served.
# A reader asking "what does DIS-01 require" had to parse a PDF or scrape the
# page to recover the file that produced both.
#
# controls.yaml is the source of truth (see its header) and the identifiers in
# it are permanent, so it is the stable thing to cite. whitepaper.md is the
# prose the PDF is typeset from — same words, no PDF extraction.
#
# Mounted rather than copied: a second copy in static/ would be a fork of the
# source of truth, which is the one thing this repository is careful never to
# have.
#
# The `static -> static` line below is load-bearing and must stay. Hugo only
# supplies a default mount for a component nobody mounts explicitly. The moment
# any mount names a `static/...` target, the implicit `static -> static` is
# replaced rather than extended, and every real asset silently disappears from
# the build: robots.txt, whitepaper.pdf, the fonts, the stylesheet, theme.js,
# the icons, .well-known/security.txt. The build still succeeds and reports
# "Static files | 2". Removing this line does not fail CI; it ships an
# unstyled site with no paper.
[[module.mounts]]
  source = "static"
  target = "static"
[[module.mounts]]
  source = "whitepaper/controls.yaml"
  target = "static/controls.yaml"
[[module.mounts]]
  source = "whitepaper/whitepaper.md"
  target = "static/whitepaper.md"
[[module.mounts]]
  source = "whitepaper/contributors.yaml"
  target = "data/contributors.yaml"
[[module.mounts]]
  source = "layouts"
  target = "layouts"
[[module.mounts]]
  source = "content"
  target = "content"

[params]
  version       = "1.0-draft"
  published     = "30 July 2026"
  commentsUntil = "30 September 2026"
  repo          = "https://github.com/agentbaseline/agentbaseline"

# The event strip renders only while `until` is in the future, so it removes
# itself the day after rather than relying on anyone noticing.
[params.event]
  id    = "blackhat-2026"
  label = "Live · Black Hat"
  say   = "Docker, Keycard and Snyk are there 3–7 August. Bring the baseline a hard question."
  cta   = "RSVP"
  url   = "https://luma.com/insecure-wbn3"
  until = "2026-08-08"
  # The closing block renders from the same table, so the strip and the block
  # expire together and can never disagree about the event.
  pull  = "Filing an issue is the durable way to disagree with this. Being in the room is the faster one."
  when  = "Black Hat week · 3–7 August 2026"
  where = "Marquee, Las Vegas"
  what  = "Securing Your Coding Agent: The Road to the Software Factory"
  who   = "A panel with Docker, Keycard and Snyk"
