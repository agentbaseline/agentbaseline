<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="f1t f1d">
  <title id="f1t">The six outcomes as one control system</title>
  <desc id="f1d">Business intent enters from the left and passes through three gating outcomes — Authorize, Constrain and Validate — before becoming an enterprise action. Discover brackets that path from above, setting the operating envelope before anything runs. Observe and Respond bracket it from below, holding evidence and containment across every run.</desc>
  <defs>
  <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5"
          markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#2B2E2B"/>
  </marker>
  <marker id="b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5"
          markerHeight="5.5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#8E928E"/>
  </marker>
</defs>
  <rect width="960" height="470" fill="#FCFCFB"/>
  <text x="40" y="44" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="23" fill="#1A1C1A" font-weight="700" text-anchor="start">One control system</text>
  <text x="40" y="66" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="13.5" fill="#5C605C" font-weight="400" text-anchor="start">across enterprise intent, action, evidence and containment</text>
  <line x1="40" y1="84" x2="920" y2="84" stroke="#DFE0DC" stroke-width="1"/>
  <rect x="248" y="104" width="672" height="62" rx="8" fill="#EEECFB" stroke="#4A3FB0" stroke-width="1.4" class="band band-env"/>
  <text x="268" y="125" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#4A3FB0" font-weight="500" text-anchor="start" letter-spacing="0.11em">ESTABLISH THE OPERATING ENVELOPE</text>
  <text x="268" y="152" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="22" fill="#1A1C1A" font-weight="700" text-anchor="start">Discover</text>
  <text x="376" y="152" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#4A3FB0" font-weight="700" text-anchor="start" letter-spacing="0.03em">DIS-01…07</text>
  <text x="900" y="146" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12" fill="#5C605C" font-weight="400" text-anchor="end">before anything runs, and continuously</text>
  <text x="900" y="129" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="11.5" fill="#8E928E" font-weight="400" text-anchor="end">as agents, permissions and context change</text>
  <line x1="128" y1="208" x2="852" y2="208" stroke="#2B2E2B" stroke-width="2" marker-end="url(#a)" class="spine"/>
  <text x="40" y="200" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="15" fill="#1A1C1A" font-weight="700" text-anchor="start">Business intent</text>
  <text x="40" y="218" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="11.5" fill="#5C605C" font-weight="400" text-anchor="start">human, service</text>
  <text x="40" y="233" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="11.5" fill="#5C605C" font-weight="400" text-anchor="start">or business event</text>
  <text x="920" y="200" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="15" fill="#1A1C1A" font-weight="700" text-anchor="end">Enterprise action</text>
  <text x="920" y="218" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="11.5" fill="#5C605C" font-weight="400" text-anchor="end">tool, API, record</text>
  <text x="920" y="233" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="11.5" fill="#5C605C" font-weight="400" text-anchor="end">or transaction</text>
  <rect x="252" y="182" width="600" height="96" rx="8" fill="none" stroke="#12457F" stroke-width="1.4" stroke-dasharray="0" class="band band-act"/>
  <rect x="252" y="182" width="600" height="20" rx="8" fill="#E8F0FA"/>
  <rect x="252" y="194" width="600" height="8" fill="#E8F0FA"/>
  <text x="268" y="196" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#12457F" font-weight="500" text-anchor="start" letter-spacing="0.11em">CONTROL EACH MATERIAL ACTION</text>
  <rect x="268" y="214" width="168" height="48" rx="6" fill="#FFFFFF" stroke="#DFE0DC" stroke-width="1.2" class="cell cell-aut"/>
  <text x="284" y="244" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="20" fill="#1A1C1A" font-weight="700" text-anchor="start">Authorize</text>
  <text x="284" y="262" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#12457F" font-weight="700" text-anchor="start" letter-spacing="0.03em">AUT-01…06</text>
  <rect x="456" y="214" width="168" height="48" rx="6" fill="#FFFFFF" stroke="#DFE0DC" stroke-width="1.2" class="cell cell-con"/>
  <text x="472" y="244" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="20" fill="#1A1C1A" font-weight="700" text-anchor="start">Constrain</text>
  <text x="472" y="262" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#12457F" font-weight="700" text-anchor="start" letter-spacing="0.03em">CON-01…07</text>
  <rect x="644" y="214" width="168" height="48" rx="6" fill="#FFFFFF" stroke="#DFE0DC" stroke-width="1.2" class="cell cell-val"/>
  <text x="660" y="244" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="20" fill="#1A1C1A" font-weight="700" text-anchor="start">Validate</text>
  <text x="660" y="262" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#12457F" font-weight="700" text-anchor="start" letter-spacing="0.03em">VAL-01…05</text>
  <text x="480.0" y="172" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="11.5" fill="#8E928E" font-weight="400" text-anchor="middle">checks stay outside model reasoning</text>
  <rect x="248" y="318" width="672" height="76" rx="8" fill="#E7F2EB" stroke="#1F5F3B" stroke-width="1.4" class="band band-evi"/>
  <text x="268" y="339" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#1F5F3B" font-weight="500" text-anchor="start" letter-spacing="0.11em">MAINTAIN EVIDENCE AND CONTAINMENT</text>
  <text x="268" y="370" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="20" fill="#1A1C1A" font-weight="700" text-anchor="start">Observe</text>
  <text x="362" y="370" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#1F5F3B" font-weight="700" text-anchor="start" letter-spacing="0.03em">OBS-01…04</text>
  <text x="568" y="370" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="20" fill="#1A1C1A" font-weight="700" text-anchor="start">Respond</text>
  <text x="664" y="370" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#1F5F3B" font-weight="700" text-anchor="start" letter-spacing="0.03em">RES-01…04</text>
  <text x="900" y="370" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="11.5" fill="#8E928E" font-weight="400" text-anchor="end">across every run, including delegated work</text>
  <line x1="480.0" y1="166" x2="480.0" y2="156" stroke="#8E928E" stroke-width="1.2" marker-end="url(#b)"/>
  <line x1="480.0" y1="278" x2="480.0" y2="310" stroke="#8E928E" stroke-width="1.2" marker-end="url(#b)"/>
  <text x="492.0" y="186" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#8E928E" font-weight="400" text-anchor="start">sets the permitted envelope</text>
  <text x="492.0" y="296" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#8E928E" font-weight="400" text-anchor="start">emits correlated decisions and outcomes</text>
  <line x1="40" y1="428" x2="920" y2="428" stroke="#DFE0DC" stroke-width="1"/>
  <text x="40" y="448" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#8E928E" font-weight="400" text-anchor="start">33 controls · six outcomes · end-to-end control requires all six</text>
  </svg>
