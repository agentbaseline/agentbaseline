<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 466" width="960" height="466" role="img" aria-labelledby="f1t f1d">
  <title id="f1t">Three questions, six outcomes</title>
  <desc id="f1d">The six outcomes answer three questions. What is operating and under whose authority: Discover and Authorize. Is it staying inside approved boundaries: Constrain and Validate. Can you prove what happened and stop it: Observe and Respond.</desc>
  <rect width="960" height="466" fill="#FCFCFA"/>
  <text x="40" y="44" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="22" fill="#1A1C1A" font-weight="700">Three questions, six outcomes</text>
  <text x="40" y="66" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="13" fill="#5A5E5A" font-weight="400">No single enforcement point delivers all six</text>
  <rect x="40" y="96" width="880" height="104" rx="8" fill="#F1EFFC" stroke="#4A3FB0" stroke-width="1.2" class="band band-1"/>
  <text x="60" y="122" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#4A3FB0" font-weight="700" letter-spacing="0.06em">1</text>
  <text x="60" y="148" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="17" fill="#1A1C1A" font-weight="700">What is operating, and under</text>
  <text x="60" y="170" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="17" fill="#1A1C1A" font-weight="700">whose authority?</text>
  <rect x="366" y="114" width="258" height="68" rx="6" fill="#FFFFFF" stroke="#DCDDD9" stroke-width="1.1" class="cell cell-dis"/>
  <text x="384" y="144" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="20" fill="#1A1C1A" font-weight="700">Discover</text>
  <text x="384" y="164" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#4A3FB0" font-weight="700" letter-spacing="0.03em">DIS-01…07</text>
  <rect x="644" y="114" width="258" height="68" rx="6" fill="#FFFFFF" stroke="#DCDDD9" stroke-width="1.1" class="cell cell-aut"/>
  <text x="662" y="144" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="20" fill="#1A1C1A" font-weight="700">Authorize</text>
  <text x="662" y="164" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#4A3FB0" font-weight="700" letter-spacing="0.03em">AUT-01…06</text>
  <rect x="40" y="214" width="880" height="104" rx="8" fill="#E9F0FA" stroke="#12457F" stroke-width="1.2" class="band band-2"/>
  <text x="60" y="240" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#12457F" font-weight="700" letter-spacing="0.06em">2</text>
  <text x="60" y="266" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="17" fill="#1A1C1A" font-weight="700">Is it staying inside approved</text>
  <text x="60" y="288" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="17" fill="#1A1C1A" font-weight="700">boundaries?</text>
  <rect x="366" y="232" width="258" height="68" rx="6" fill="#FFFFFF" stroke="#DCDDD9" stroke-width="1.1" class="cell cell-con"/>
  <text x="384" y="262" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="20" fill="#1A1C1A" font-weight="700">Constrain</text>
  <text x="384" y="282" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#12457F" font-weight="700" letter-spacing="0.03em">CON-01…07</text>
  <rect x="644" y="232" width="258" height="68" rx="6" fill="#FFFFFF" stroke="#DCDDD9" stroke-width="1.1" class="cell cell-val"/>
  <text x="662" y="262" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="20" fill="#1A1C1A" font-weight="700">Validate</text>
  <text x="662" y="282" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#12457F" font-weight="700" letter-spacing="0.03em">VAL-01…05</text>
  <rect x="40" y="332" width="880" height="104" rx="8" fill="#E8F3EC" stroke="#1F5F3B" stroke-width="1.2" class="band band-3"/>
  <text x="60" y="358" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#1F5F3B" font-weight="700" letter-spacing="0.06em">3</text>
  <text x="60" y="384" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="17" fill="#1A1C1A" font-weight="700">Can you prove what happened —</text>
  <text x="60" y="406" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="17" fill="#1A1C1A" font-weight="700">and stop it?</text>
  <rect x="366" y="350" width="258" height="68" rx="6" fill="#FFFFFF" stroke="#DCDDD9" stroke-width="1.1" class="cell cell-obs"/>
  <text x="384" y="380" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="20" fill="#1A1C1A" font-weight="700">Observe</text>
  <text x="384" y="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#1F5F3B" font-weight="700" letter-spacing="0.03em">OBS-01…04</text>
  <rect x="644" y="350" width="258" height="68" rx="6" fill="#FFFFFF" stroke="#DCDDD9" stroke-width="1.1" class="cell cell-res"/>
  <text x="662" y="380" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="20" fill="#1A1C1A" font-weight="700">Respond</text>
  <text x="662" y="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#1F5F3B" font-weight="700" letter-spacing="0.03em">RES-01…04</text>
  </svg>
