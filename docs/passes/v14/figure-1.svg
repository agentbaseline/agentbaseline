<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 518" width="960" height="518" role="img" aria-labelledby="f1t f1d">
  <title id="f1t">Where the six outcomes operate</title>
  <desc id="f1d">The six operate at three scopes. Discover is a standing inventory of the whole estate, maintained before anything runs. Authorize, Constrain and Validate are gates in the path of a single action: they decide whether this actor may act, with what reach, and whether the result is sound. Observe and Respond span every run, holding the record during and after.</desc>
  <rect width="960" height="518" fill="#FCFCFA"/>
  <text x="40" y="42" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="22" fill="#1A1C1A" font-weight="700">Where the six operate</text>
  <text x="40" y="64" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="13" fill="#5A5E5A" font-weight="400">Three scopes: the estate, a single action, and every run</text>
  <line x1="40" y1="96" x2="40" y2="184" stroke="#DCDDD9" stroke-width="2"/>
  <text x="54" y="114" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#8A8E8A" font-weight="600" letter-spacing="0.11em">BEFORE ANY RUN</text>
  <text x="54" y="132" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">the whole estate</text>
  <rect x="240" y="92" width="680" height="96" rx="8" fill="#F1EFFC" stroke="#4A3FB0" stroke-width="1.2" class="band band-1"/>
  <rect x="256" y="106" width="300" height="68" rx="6" fill="#FFFFFF" stroke="#DCDDD9" stroke-width="1.1" class="cell cell-dis"/>
  <text x="272" y="136" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="19" fill="#1A1C1A" font-weight="700">Discover</text>
  <text x="272" y="155" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#4A3FB0" font-weight="700" letter-spacing="0.03em">DIS-01…07</text>
  <text x="576" y="132" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="13" fill="#5A5E5A" font-weight="400">What exists, who owns it, what it can reach —</text>
  <text x="576" y="152" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="13" fill="#5A5E5A" font-weight="400">reconciled against what is actually running.</text>
  <line x1="40" y1="218" x2="40" y2="342" stroke="#DCDDD9" stroke-width="2"/>
  <text x="54" y="236" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#8A8E8A" font-weight="600" letter-spacing="0.11em">PER ACTION</text>
  <text x="54" y="254" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">in-line, every time</text>
  <rect x="240" y="214" width="680" height="132" rx="8" fill="#E9F0FA" stroke="#12457F" stroke-width="1.2" class="band band-2"/>
  <rect x="256" y="228" width="206" height="104" rx="6" fill="#FFFFFF" stroke="#DCDDD9" stroke-width="1.1" class="cell cell-aut"/>
  <text x="272" y="258" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="19" fill="#1A1C1A" font-weight="700">Authorize</text>
  <text x="272" y="277" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#12457F" font-weight="700" letter-spacing="0.03em">AUT-01…06</text>
  <text x="272" y="300" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">May this actor act?</text>
  <rect x="476" y="228" width="206" height="104" rx="6" fill="#FFFFFF" stroke="#DCDDD9" stroke-width="1.1" class="cell cell-con"/>
  <text x="492" y="258" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="19" fill="#1A1C1A" font-weight="700">Constrain</text>
  <text x="492" y="277" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#12457F" font-weight="700" letter-spacing="0.03em">CON-01…07</text>
  <text x="492" y="300" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">With what reach?</text>
  <rect x="696" y="228" width="206" height="104" rx="6" fill="#FFFFFF" stroke="#DCDDD9" stroke-width="1.1" class="cell cell-val"/>
  <text x="712" y="258" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="19" fill="#1A1C1A" font-weight="700">Validate</text>
  <text x="712" y="277" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#12457F" font-weight="700" letter-spacing="0.03em">VAL-01…05</text>
  <text x="712" y="300" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">Is the result sound?</text>
  <line x1="40" y1="376" x2="40" y2="480" stroke="#DCDDD9" stroke-width="2"/>
  <text x="54" y="394" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#8A8E8A" font-weight="600" letter-spacing="0.11em">EVERY RUN</text>
  <text x="54" y="412" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">during and after</text>
  <rect x="240" y="372" width="680" height="112" rx="8" fill="#E8F3EC" stroke="#1F5F3B" stroke-width="1.2" class="band band-3"/>
  <rect x="256" y="386" width="317" height="84" rx="6" fill="#FFFFFF" stroke="#DCDDD9" stroke-width="1.1" class="cell cell-obs"/>
  <text x="272" y="416" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="19" fill="#1A1C1A" font-weight="700">Observe</text>
  <text x="272" y="435" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1F5F3B" font-weight="700" letter-spacing="0.03em">OBS-01…04</text>
  <text x="272" y="458" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">Prove what happened</text>
  <rect x="587" y="386" width="317" height="84" rx="6" fill="#FFFFFF" stroke="#DCDDD9" stroke-width="1.1" class="cell cell-res"/>
  <text x="603" y="416" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="19" fill="#1A1C1A" font-weight="700">Respond</text>
  <text x="603" y="435" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1F5F3B" font-weight="700" letter-spacing="0.03em">RES-01…04</text>
  <text x="603" y="458" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">Stop it, and scope the damage</text>
  </svg>
