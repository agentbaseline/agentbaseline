<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" role="img" aria-labelledby="ft fd">
  <title id="ft">The six outcomes as one control system</title>
  <desc id="fd">Discover establishes the operating envelope above the action path. Business intent passes through Authorize, Constrain and Validate — the only enclosed stage, because every material action must go through it — and becomes an enterprise action. Observe and Respond hold evidence and containment beneath.</desc>
  <rect width="880" height="390" fill="#FFFFFF"/>
  <defs><linearGradient id="fadeCBCDC80x880" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#CBCDC8" stop-opacity="0"/><stop offset="0.06" stop-color="#CBCDC8" stop-opacity="1"/><stop offset="0.82" stop-color="#CBCDC8" stop-opacity="1"/><stop offset="1" stop-color="#CBCDC8" stop-opacity="0"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#797D79"/></marker><linearGradient id="fadeE4E5E10x880" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#E4E5E1" stop-opacity="0"/><stop offset="0.06" stop-color="#E4E5E1" stop-opacity="1"/><stop offset="0.82" stop-color="#E4E5E1" stop-opacity="1"/><stop offset="1" stop-color="#E4E5E1" stop-opacity="0"/></linearGradient></defs>
  <line x1="0" y1="30" x2="880" y2="30" stroke="url(#fadeCBCDC80x880)" stroke-width="1"/>
  <text x="0" y="54" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#5A5E5A" font-weight="400" letter-spacing="0.12em">ESTABLISH THE OPERATING ENVELOPE</text>
  <text x="0" y="88" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="21" fill="#1A1C1A" font-weight="700">Discover</text>
  <text x="0" y="197.0" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="16" fill="#1A1C1A" font-weight="700">Business intent</text>
  <text x="0" y="219.0" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="16" fill="#5A5E5A" font-weight="400">a person, service</text>
  <text x="0" y="240.0" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="16" fill="#5A5E5A" font-weight="400">or business event</text>
  <line x1="150" y1="203.0" x2="182" y2="203.0" stroke="#797D79" stroke-width="1.1" marker-end="url(#ar)"/>
  <rect x="196" y="134" width="460" height="138" rx="3" fill="none" stroke="#E4E5E1" stroke-width="1"/>
  <text x="220" y="164" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#5A5E5A" font-weight="400" letter-spacing="0.12em">CONTROL EACH MATERIAL ACTION</text>
  <text x="220" y="212" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="21" fill="#1A1C1A" font-weight="700">Authorize</text>
  <text x="357" y="212" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="21" fill="#1A1C1A" font-weight="700">Constrain</text>
  <text x="494" y="212" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="21" fill="#1A1C1A" font-weight="700">Validate</text>
  <line x1="670" y1="203.0" x2="700" y2="203.0" stroke="#797D79" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="712" y="197.0" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="16" fill="#1A1C1A" font-weight="700">Enterprise action</text>
  <text x="712" y="219.0" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="16" fill="#5A5E5A" font-weight="400">a tool, API,</text>
  <text x="712" y="240.0" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="16" fill="#5A5E5A" font-weight="400">record or message</text>
  <line x1="0" y1="294" x2="880" y2="294" stroke="url(#fadeE4E5E10x880)" stroke-width="1"/>
  <text x="0" y="318" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#5A5E5A" font-weight="400" letter-spacing="0.12em">MAINTAIN EVIDENCE AND CONTAINMENT</text>
  <text x="0" y="352" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="21" fill="#1A1C1A" font-weight="700">Observe</text>
  <text x="220" y="352" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="21" fill="#1A1C1A" font-weight="700">Respond</text>
  <line x1="0" y1="378" x2="880" y2="378" stroke="url(#fadeCBCDC80x880)" stroke-width="1"/>
  </svg>
