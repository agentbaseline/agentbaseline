<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" role="img" aria-labelledby="ft fd">
  <title id="ft">The six outcomes as one control system</title>
  <desc id="fd">Discover establishes the operating envelope. Business intent passes through Authorize, Constrain and Validate to become an enterprise action. Observe and Respond maintain evidence and containment across every run.</desc>
  <rect width="900" height="452" fill="#FFFFFF"/>
  <defs><linearGradient id="fadeCBCDC8" x1="0" x2="1"><stop offset="0" stop-color="#CBCDC8" stop-opacity="0"/><stop offset="0.06" stop-color="#CBCDC8" stop-opacity="1"/><stop offset="0.82" stop-color="#CBCDC8" stop-opacity="1"/><stop offset="1" stop-color="#CBCDC8" stop-opacity="0"/></linearGradient><linearGradient id="fadeE4E5E1" x1="0" x2="1"><stop offset="0" stop-color="#E4E5E1" stop-opacity="0"/><stop offset="0.06" stop-color="#E4E5E1" stop-opacity="1"/><stop offset="0.82" stop-color="#E4E5E1" stop-opacity="1"/><stop offset="1" stop-color="#E4E5E1" stop-opacity="0"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#797D79"/></marker></defs>
  <line x1="0" y1="34" x2="900" y2="34" stroke="url(#fadeCBCDC8)" stroke-width="1"/>
  <text x="0" y="56" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#5A5E5A" font-weight="400" letter-spacing="0.12em">ESTABLISH THE OPERATING ENVELOPE</text>
  <text x="0" y="86" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="21" fill="#1A1C1A" font-weight="700">Discover</text>
  <text x="0" y="107" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#1A4D8F" font-weight="700" letter-spacing="0.03em">DIS-01…07</text>
  <text x="320" y="86" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">Every agent and component, its owner, and what it can reach —</text>
  <text x="320" y="108" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">reconciled continuously against what is actually running.</text>
  <line x1="0" y1="160" x2="900" y2="160" stroke="url(#fadeE4E5E1)" stroke-width="1"/>
  <text x="0" y="182" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#5A5E5A" font-weight="400" letter-spacing="0.12em">CONTROL EACH MATERIAL ACTION</text>
  <text x="0" y="210" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="15" fill="#1A1C1A" font-weight="700">Business intent</text>
  <text x="0" y="230" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="13" fill="#5A5E5A" font-weight="400">a person, service</text>
  <text x="0" y="248" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="13" fill="#5A5E5A" font-weight="400">or business event</text>
  <line x1="138" y1="224" x2="174" y2="224" stroke="#797D79" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="190" y="208" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="21" fill="#1A1C1A" font-weight="700">Authorize</text>
  <text x="190" y="229" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#1A4D8F" font-weight="700" letter-spacing="0.03em">AUT-01…06</text>
  <text x="190" y="254" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">may this actor act?</text>
  <text x="358" y="208" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="21" fill="#1A1C1A" font-weight="700">Constrain</text>
  <text x="358" y="229" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#1A4D8F" font-weight="700" letter-spacing="0.03em">CON-01…07</text>
  <text x="358" y="254" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">with what reach?</text>
  <text x="526" y="208" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="21" fill="#1A1C1A" font-weight="700">Validate</text>
  <text x="526" y="229" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#1A4D8F" font-weight="700" letter-spacing="0.03em">VAL-01…05</text>
  <text x="526" y="254" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">is the result sound?</text>
  <line x1="696" y1="226" x2="728" y2="226" stroke="#797D79" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="742" y="210" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="15" fill="#1A1C1A" font-weight="700">Enterprise action</text>
  <text x="742" y="230" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="13" fill="#5A5E5A" font-weight="400">a tool, API, record</text>
  <text x="742" y="248" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="13" fill="#5A5E5A" font-weight="400">or transaction</text>
  <line x1="0" y1="308" x2="900" y2="308" stroke="url(#fadeE4E5E1)" stroke-width="1"/>
  <text x="0" y="330" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#5A5E5A" font-weight="400" letter-spacing="0.12em">MAINTAIN EVIDENCE AND CONTAINMENT</text>
  <text x="0" y="360" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="21" fill="#1A1C1A" font-weight="700">Observe</text>
  <text x="0" y="381" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#1A4D8F" font-weight="700" letter-spacing="0.03em">OBS-01…04</text>
  <text x="0" y="406" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">prove what happened</text>
  <text x="320" y="360" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="21" fill="#1A1C1A" font-weight="700">Respond</text>
  <text x="320" y="381" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#1A4D8F" font-weight="700" letter-spacing="0.03em">RES-01…04</text>
  <text x="320" y="406" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="15" fill="#5A5E5A" font-weight="400">stop it, scope the damage</text>
  <text x="660" y="360" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">Across every run, including</text>
  <text x="660" y="382" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">delegated work downstream.</text>
  <line x1="0" y1="436" x2="900" y2="436" stroke="url(#fadeCBCDC8)" stroke-width="1"/>
  </svg>
