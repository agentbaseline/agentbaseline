<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 428" width="900" height="428" role="img" aria-labelledby="ft fd">
  <title id="ft">The six outcomes as one control system</title>
  <desc id="fd">Discover establishes the operating envelope. Business intent passes through Authorize, Constrain and Validate to become an enterprise action. Observe and Respond maintain evidence and containment across every run.</desc>
  <rect width="900" height="428" fill="#FFFFFF"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#797D79"/></marker></defs>
  <line x1="32" y1="34" x2="868" y2="34" stroke="#CBCDC8" stroke-width="1"/>
  <text x="32" y="56" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#797D79" font-weight="600" letter-spacing="0.12em">ESTABLISH THE OPERATING ENVELOPE</text>
  <text x="32" y="86" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="19" fill="#1A1C1A" font-weight="700">Discover</text>
  <text x="32" y="106" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1A4D8F" font-weight="700" letter-spacing="0.03em">DIS-01…07</text>
  <text x="332" y="86" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">Every agent and component, its owner, and what it can reach —</text>
  <text x="332" y="104" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">reconciled continuously against what is actually running.</text>
  <line x1="32" y1="152" x2="868" y2="152" stroke="#E4E5E1" stroke-width="1"/>
  <text x="32" y="174" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#797D79" font-weight="600" letter-spacing="0.12em">CONTROL EACH MATERIAL ACTION</text>
  <text x="32" y="200" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="14" fill="#1A1C1A" font-weight="700">Business intent</text>
  <text x="32" y="218" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12" fill="#5A5E5A" font-weight="400">a person, service</text>
  <text x="32" y="234" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12" fill="#5A5E5A" font-weight="400">or business event</text>
  <line x1="164" y1="214" x2="200" y2="214" stroke="#797D79" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="218" y="200" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="19" fill="#1A1C1A" font-weight="700">Authorize</text>
  <text x="218" y="220" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1A4D8F" font-weight="700" letter-spacing="0.03em">AUT-01…06</text>
  <text x="218" y="245" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">may this actor act?</text>
  <text x="390" y="200" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="19" fill="#1A1C1A" font-weight="700">Constrain</text>
  <text x="390" y="220" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1A4D8F" font-weight="700" letter-spacing="0.03em">CON-01…07</text>
  <text x="390" y="245" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">with what reach?</text>
  <text x="562" y="200" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="19" fill="#1A1C1A" font-weight="700">Validate</text>
  <text x="562" y="220" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1A4D8F" font-weight="700" letter-spacing="0.03em">VAL-01…05</text>
  <text x="562" y="245" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">is the result sound?</text>
  <line x1="720" y1="214" x2="752" y2="214" stroke="#797D79" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="764" y="200" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="14" fill="#1A1C1A" font-weight="700">Enterprise action</text>
  <text x="764" y="218" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12" fill="#5A5E5A" font-weight="400">a tool, API, record</text>
  <text x="764" y="234" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12" fill="#5A5E5A" font-weight="400">or transaction</text>
  <line x1="32" y1="292" x2="868" y2="292" stroke="#E4E5E1" stroke-width="1"/>
  <text x="32" y="314" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#797D79" font-weight="600" letter-spacing="0.12em">MAINTAIN EVIDENCE AND CONTAINMENT</text>
  <text x="32" y="344" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="19" fill="#1A1C1A" font-weight="700">Observe</text>
  <text x="32" y="364" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1A4D8F" font-weight="700" letter-spacing="0.03em">OBS-01…04</text>
  <text x="32" y="389" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">prove what happened</text>
  <text x="332" y="344" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="19" fill="#1A1C1A" font-weight="700">Respond</text>
  <text x="332" y="364" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1A4D8F" font-weight="700" letter-spacing="0.03em">RES-01…04</text>
  <text x="332" y="389" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">stop it, scope the damage</text>
  <text x="652" y="344" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">Across every run, including</text>
  <text x="652" y="362" font-family="Charter,'Iowan Old Style',Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">delegated work downstream.</text>
  <line x1="32" y1="412" x2="868" y2="412" stroke="#CBCDC8" stroke-width="1"/>
  </svg>
